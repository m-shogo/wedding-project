name: Profile V1 Production CI

on:
  pull_request:
    paths:
      - "01_profile-movie/**"
      - "motion-studio/src/data/profileV1ProductionPlan.ts"
      - "motion-studio/src/compositions/profile/**"
      - "motion-studio/src/ProfileV1Root.tsx"
      - "motion-studio/src/index-profile-v1.ts"
      - "motion-studio/scripts/profile-v1-assembly-preflight.mts"
      - "motion-studio/scripts/profile-v1-bgm-rights-approval.mts"
      - "motion-studio/scripts/profile-v1-departure-preview-review.mts"
      - "motion-studio/scripts/profile-v1-full-structure-review.mts"
      - "motion-studio/scripts/check-profile-v1-production-plan.mts"
      - "motion-studio/scripts/check-profile-v1-departure-preview.mts"
      - "motion-studio/scripts/check-profile-v1-full-structure-preview.mts"
      - "motion-studio/scripts/render-profile-v1-departure-qa-stills.mts"
      - "motion-studio/scripts/render-profile-v1-departure-structure-preview.mts"
      - "motion-studio/scripts/render-profile-v1-full-structure-preview.mts"
      - ".github/workflows/profile-v1-production-ci.yml"
  push:
    paths:
      - "01_profile-movie/**"
      - "motion-studio/src/data/profileV1ProductionPlan.ts"
      - "motion-studio/src/compositions/profile/**"
      - "motion-studio/src/ProfileV1Root.tsx"
      - "motion-studio/src/index-profile-v1.ts"
      - "motion-studio/scripts/profile-v1-assembly-preflight.mts"
      - "motion-studio/scripts/profile-v1-bgm-rights-approval.mts"
      - "motion-studio/scripts/profile-v1-departure-preview-review.mts"
      - "motion-studio/scripts/profile-v1-full-structure-review.mts"
      - "motion-studio/scripts/check-profile-v1-production-plan.mts"
      - "motion-studio/scripts/check-profile-v1-departure-preview.mts"
      - "motion-studio/scripts/check-profile-v1-full-structure-preview.mts"
      - "motion-studio/scripts/render-profile-v1-departure-qa-stills.mts"
      - "motion-studio/scripts/render-profile-v1-departure-structure-preview.mts"
      - "motion-studio/scripts/render-profile-v1-full-structure-preview.mts"
      - ".github/workflows/profile-v1-production-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: motion-studio
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: motion-studio/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript
        run: pnpm typecheck

      - name: Profile V1 canonical production plan
        run: node --no-warnings scripts/check-profile-v1-production-plan.mts

      - name: Profile V1 departure structure preview contract
        run: node --no-warnings scripts/check-profile-v1-departure-preview.mts

      - name: Profile V1 full structure preview contract
        run: node --no-warnings scripts/check-profile-v1-full-structure-preview.mts

      - name: Profile V1 preflight stays honest on a fresh clone
        run: |
          mkdir -p out/qa
          node --no-warnings scripts/profile-v1-assembly-preflight.mts --json > out/qa/profile-v1-assembly-preflight.json
          node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync('out/qa/profile-v1-assembly-preflight.json','utf8')); if(r.schemaVersion!=='profile-v1-assembly-preflight/v1') process.exit(1); if(r.authority!=='MOTION_STUDIO_DERIVED_PREFLIGHT') process.exit(1); if(r.chapters.length!==5) process.exit(1); if(r.media.expectedCount!==17) process.exit(1); if(r.media.readyCount!==0) process.exit(1); if(r.audio.rightsState!=='NOT_RUN') process.exit(1); if(r.readiness.finalRenderEligible!==false) process.exit(1); if(r.readiness.previewQaState!=='NOT_RUN') process.exit(1); if(r.readiness.humanContentQaState!=='NOT_RUN') process.exit(1); if(r.readiness.macDaVinciActualState!=='NOT_RUN') process.exit(1); if(r.readiness.productionReady!==false) process.exit(1);"
          if node --no-warnings scripts/profile-v1-assembly-preflight.mts --strict; then
            echo "Profile V1 preflight unexpectedly passed without real media and human-cleared BGM"
            exit 1
          fi
          echo "Profile V1 preflight correctly fails closed until minimum representative real media and BGM rights evidence exist"

      - name: Profile BGM rights approval cannot be manufactured by CI
        run: |
          if node --no-warnings scripts/profile-v1-bgm-rights-approval.mts --init; then
            echo "BGM approval init unexpectedly succeeded without a BGM file"
            exit 1
          fi
          mkdir -p public/audio/profile
          printf 'ci-placeholder-not-real-audio' > public/audio/profile/bgm-main.mp3
          node --no-warnings scripts/profile-v1-bgm-rights-approval.mts --init
          node -e "const fs=require('fs'); const a=JSON.parse(fs.readFileSync('out/qa/profile-v1-bgm-rights-approval.json','utf8')); if(a.schemaVersion!=='profile-v1-bgm-rights-approval/v1') process.exit(1); if(a.authority!=='HUMAN_BGM_RIGHTS_APPROVAL') process.exit(1); if(a.decision!=='HOLD') process.exit(1); if(a.rightsCleared!==false) process.exit(1); if(a.approver!==null) process.exit(1); if(!a.bgm.sha256) process.exit(1);"
          if node --no-warnings scripts/profile-v1-bgm-rights-approval.mts --strict; then
            echo "BGM rights unexpectedly passed without explicit human approval"
            exit 1
          fi
          printf 'changed-ci-placeholder' > public/audio/profile/bgm-main.mp3
          node --no-warnings scripts/profile-v1-bgm-rights-approval.mts --json > out/qa/profile-v1-bgm-rights-status.json
          node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync('out/qa/profile-v1-bgm-rights-status.json','utf8')); if(!r.blockers.includes('STALE_PROFILE_BGM_RIGHTS_APPROVAL_SHA')) process.exit(1); if(r.rightsCleared!==false) process.exit(1);"
          echo "Profile BGM rights init is HOLD-only, strict remains blocked, and changing the BGM invalidates the bound approval SHA"

      - name: Render Profile V1 departure structure preview
        run: node --no-warnings scripts/render-profile-v1-departure-structure-preview.mts

      - name: Profile departure structure review remains human-only
        run: |
          node --no-warnings scripts/profile-v1-departure-preview-review.mts --init
          node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync('out/qa/profile-v1-departure-structure-review.json','utf8')); if(r.schemaVersion!=='profile-v1-departure-structure-review/v1') process.exit(1); if(r.authority!=='HUMAN_STRUCTURE_PREVIEW_REVIEW') process.exit(1); if(r.review.overall!=='NOT_RUN') process.exit(1); if(r.review.reviewer!==null) process.exit(1); if(r.realMediaReviewed!==false) process.exit(1); if(r.bgmReviewed!==false) process.exit(1); if(r.productionReady!==false) process.exit(1); for(const c of r.checkpoints){if(c.timing!=='NOT_RUN'||c.visualFlow!=='NOT_RUN'||c.readability!=='NOT_RUN') process.exit(1)}"
          if node --no-warnings scripts/profile-v1-departure-preview-review.mts --strict; then
            echo "Structure review unexpectedly passed without a human verdict"
            exit 1
          fi
          echo "Profile departure preview is SHA-bound but Human structure review remains NOT_RUN and cannot promote real media/BGM/production"

      - name: Render Profile V1 full structure preview
        run: node --no-warnings scripts/render-profile-v1-full-structure-preview.mts

      - name: Profile full structure review remains human-only
        run: |
          node --no-warnings scripts/profile-v1-full-structure-review.mts --init
          node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync('out/qa/profile-v1-full-structure-review.json','utf8')); if(r.schemaVersion!=='profile-v1-full-structure-review/v1') process.exit(1); if(r.authority!=='HUMAN_FULL_STRUCTURE_REVIEW') process.exit(1); if(r.chapters.length!==5) process.exit(1); if(r.review.overall!=='NOT_RUN') process.exit(1); if(r.review.reviewer!==null) process.exit(1); if(r.transitions.chapterFlow!=='NOT_RUN'||r.transitions.emotionalArc!=='NOT_RUN') process.exit(1); if(r.realMediaReviewed!==false||r.bgmReviewed!==false||r.contentAccuracyReviewed!==false) process.exit(1); if(r.macDaVinciActual!=='NOT_RUN'||r.productionReady!==false) process.exit(1); for(const c of r.chapters){if(c.chapterOrder!=='NOT_RUN'||c.visualHierarchy!=='NOT_RUN'||c.pacing!=='NOT_RUN'||c.mediaRoleClarity!=='NOT_RUN') process.exit(1)}"
          if node --no-warnings scripts/profile-v1-full-structure-review.mts --strict; then
            echo "Full structure review unexpectedly passed without a human verdict"
            exit 1
          fi
          echo "Profile full structure preview is SHA-bound but Human structure review remains NOT_RUN and cannot promote real media/BGM/content/Mac Actual/production"

      - name: Profile V1 departure visual smoke stills
        run: node --no-warnings scripts/render-profile-v1-departure-qa-stills.mts

      - name: Upload Profile V1 visual QA
        uses: actions/upload-artifact@v4
        with:
          name: profile-v1-visual-qa
          path: |
            motion-studio/out/qa/profile-v1-departure/*.png
            motion-studio/out/preview/profile_v1_departure_structure_preview.mp4
            motion-studio/out/preview/profile_v1_full_structure_preview.mp4
          if-no-files-found: error
          retention-days: 7
