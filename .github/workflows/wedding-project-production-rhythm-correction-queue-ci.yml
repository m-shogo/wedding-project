name: Wedding Project Production Rhythm Correction Queue CI

on:
  pull_request:
    paths:
      - 'motion-studio/scripts/wedding-project-production-rhythm-pass.mts'
      - 'motion-studio/scripts/verify-wedding-project-production-rhythm-pass-currentness.mts'
      - 'motion-studio/scripts/wedding-project-production-rhythm-correction-queue.mts'
      - '.github/workflows/wedding-project-production-rhythm-correction-queue-ci.yml'
  workflow_dispatch:

jobs:
  correction-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Create CURRENT rhythm + explicit Human FAIL fixture
        run: |
          mkdir -p /tmp/rhythm-queue
          printf 'render-v1' > /tmp/rhythm-queue/opening.mp4
          RENDER_SHA=$(sha256sum /tmp/rhythm-queue/opening.mp4 | awk '{print $1}')
          cat > /tmp/rhythm-queue/preview.json <<JSON
          {
            "schemaVersion":"wedding-movie-project-real-media-preview/v1",
            "authority":"DERIVED_FROM_CURRENT_SELECTED_SCENES_AND_PRODUCTION_READINESS_AUDIT",
            "projectId":"opening",
            "fps":30,
            "scenes":[
              {"sceneId":"a","sourceRevision":"r1","patternId":"p1","productionRole":"TITLE_REVEAL","timing":{"revision":"t1"},"startFrame":0,"endFrameExclusive":30,"durationFrames":30,"transitionInFrames":0,"transitionOutFrames":6},
              {"sceneId":"b","sourceRevision":"r2","patternId":"p2","productionRole":"PHOTO_MONTAGE","timing":{"revision":"t2"},"startFrame":24,"endFrameExclusive":144,"durationFrames":120,"transitionInFrames":6,"transitionOutFrames":0}
            ],
            "transitions":[{"fromSceneId":"a","toSceneId":"b","transition":"CROSS_DISSOLVE","durationFrames":6,"sourceStatus":"HUMAN_SELECTED"}],
            "timeline":{"totalFrames":144,"durationSeconds":4.8},
            "output":"/tmp/rhythm-queue/opening.mp4",
            "render":{"state":"RENDERED","sha256":"${RENDER_SHA}","bytes":9},
            "summary":{"allRealMediaBoundCurrent":true,"framingCurrent":true,"timingCurrent":true,"bgmCurrent":true,"productionReady":false},
            "evidenceBoundary":{"remotionStudioGuiActual":"NOT_RUN","palmierGuiActual":"NOT_RUN","macDaVinciGuiActual":"NOT_RUN","productionReady":false}
          }
          JSON
          node --no-warnings motion-studio/scripts/wedding-project-production-rhythm-pass.mts --preview-manifest=/tmp/rhythm-queue/preview.json --output=/tmp/rhythm-queue/rhythm.json
          node --no-warnings motion-studio/scripts/verify-wedding-project-production-rhythm-pass-currentness.mts --rhythm-pass=/tmp/rhythm-queue/rhythm.json --strict-current --output=/tmp/rhythm-queue/current.json
          RHYTHM_SHA=$(sha256sum /tmp/rhythm-queue/rhythm.json | awk '{print $1}')
          CURRENT_SHA=$(sha256sum /tmp/rhythm-queue/current.json | awk '{print $1}')
          PREVIEW_SHA=$(node -e "console.log(JSON.parse(require('fs').readFileSync('/tmp/rhythm-queue/current.json','utf8')).source.previewManifestSha256)")
          CURRENT_RENDER_SHA=$(node -e "console.log(JSON.parse(require('fs').readFileSync('/tmp/rhythm-queue/current.json','utf8')).source.renderSha256)")
          cat > /tmp/rhythm-queue/review.json <<JSON
          {
            "schemaVersion":"wedding-movie-production-rhythm-human-review/v1",
            "authority":"EXPLICIT_HUMAN_WHOLE_PROJECT_RHYTHM_REVIEW_BOUND_TO_CURRENT_RHYTHM_PASS",
            "projectId":"opening",
            "source":{"rhythmPassSha256":"${RHYTHM_SHA}","currentnessSha256":"${CURRENT_SHA}","previewManifestSha256":"${PREVIEW_SHA}","renderSha256":"${CURRENT_RENDER_SHA}"},
            "review":{"performed":true,"reviewer":"HUMAN_FIXTURE_ONLY","reviewedAt":"2026-09-01T00:00:00Z","axes":{"openingPace":{"verdict":"FAIL","notes":"fixture"},"midsectionVariety":{"verdict":"PASS","notes":""},"emotionalHold":{"verdict":"PASS","notes":""},"endingBreathingRoom":{"verdict":"PASS","notes":""},"transitionCadence":{"verdict":"FAIL","notes":"fixture edge"},"overallRhythm":{"verdict":"FAIL","notes":"fixture"}},"finalVerdict":"FAIL"},
            "summary":{"allAxesReviewed":true,"failedAxes":["openingPace","transitionCadence","overallRhythm"],"productionReady":false},
            "evidenceBoundary":{"humanRhythmReviewPerformed":true,"humanVisualQa":"NOT_RUN","remotionStudioGuiActual":"NOT_RUN","palmierGuiActual":"NOT_RUN","macDaVinciGuiActual":"NOT_RUN","productionReady":false}
          }
          JSON
      - name: Build fail-closed correction queue
        run: |
          node --no-warnings motion-studio/scripts/wedding-project-production-rhythm-correction-queue.mts --rhythm-pass=/tmp/rhythm-queue/rhythm.json --currentness=/tmp/rhythm-queue/current.json --human-review=/tmp/rhythm-queue/review.json --output=/tmp/rhythm-queue/queue.json
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const q=JSON.parse(readFileSync('/tmp/rhythm-queue/queue.json','utf8'));
          if(q.schemaVersion!=='wedding-movie-production-rhythm-correction-queue/v1') throw new Error('schema');
          if(q.summary.humanFailedAxisCount!==3) throw new Error('Human FAIL count');
          if(q.items.filter((x)=>x.kind==='HUMAN_AXIS_FAIL').some((x)=>x.sceneBindings.length!==0||x.selectionAuthority!=='HUMAN_MUST_SELECT_EXACT_SCENE_OR_EDGE_BEFORE_EDIT')) throw new Error('Human FAIL must not auto-select Scene');
          const transition=q.items.find((x)=>x.kind==='HUMAN_AXIS_FAIL'&&x.axis==='transitionCadence');
          if(!transition||transition.edgeCandidates.length!==1) throw new Error('transition FAIL requires current edge candidates');
          const edge=transition.edgeCandidates[0];
          if(edge.fromSceneId!=='a'||edge.toSceneId!=='b'||edge.fromSourceRevision!=='r1'||edge.toSourceRevision!=='r2'||edge.fromTimingRevision!=='t1'||edge.toTimingRevision!=='t2') throw new Error('transition edge revision binding');
          if(edge.returnTo.axis!=='TRANSITION'||edge.returnTo.focusSceneId!=='b'||edge.returnTo.focusSourceRevision!=='r2') throw new Error('transition correction route');
          if(q.summary.humanTransitionEdgeCandidateCount!==1||q.summary.requiresHumanEdgeSelection!==true||q.summary.requiresHumanSceneSelection!==true) throw new Error('Human selection summary');
          if(!q.items.some((x)=>x.kind==='MECHANICAL_CUE'&&x.sceneBindings.length>0)) throw new Error('expected exact mechanical Scene binding');
          if(q.evidenceBoundary.humanVisualQa!=='NOT_RUN'||q.evidenceBoundary.remotionStudioGuiActual!=='NOT_RUN'||q.evidenceBoundary.palmierGuiActual!=='NOT_RUN'||q.evidenceBoundary.macDaVinciGuiActual!=='NOT_RUN'||q.evidenceBoundary.productionReady!==false) throw new Error('evidence boundary');
          NODE
      - name: Stale Human review binding is blocked
        run: |
          cp /tmp/rhythm-queue/review.json /tmp/rhythm-queue/review-stale.json
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          const p='/tmp/rhythm-queue/review-stale.json';
          const v=JSON.parse(readFileSync(p,'utf8'));
          v.source.rhythmPassSha256='0'.repeat(64);
          writeFileSync(p,JSON.stringify(v,null,2));
          NODE
          if node --no-warnings motion-studio/scripts/wedding-project-production-rhythm-correction-queue.mts --rhythm-pass=/tmp/rhythm-queue/rhythm.json --currentness=/tmp/rhythm-queue/current.json --human-review=/tmp/rhythm-queue/review-stale.json --output=/tmp/rhythm-queue/should-not-exist.json; then
            echo 'expected stale Human review binding to block' >&2
            exit 1
          fi
      - name: Human evidence boundary promotion is blocked
        run: |
          cp /tmp/rhythm-queue/review.json /tmp/rhythm-queue/review-promoted.json
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          const p='/tmp/rhythm-queue/review-promoted.json';
          const v=JSON.parse(readFileSync(p,'utf8'));
          v.evidenceBoundary.humanVisualQa='PASS';
          writeFileSync(p,JSON.stringify(v,null,2));
          NODE
          if node --no-warnings motion-studio/scripts/wedding-project-production-rhythm-correction-queue.mts --rhythm-pass=/tmp/rhythm-queue/rhythm.json --currentness=/tmp/rhythm-queue/current.json --human-review=/tmp/rhythm-queue/review-promoted.json --output=/tmp/rhythm-queue/should-not-exist-2.json; then
            echo 'expected evidence-boundary promotion to block' >&2
            exit 1
          fi
