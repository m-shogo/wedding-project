name: Profile Assembly Review Readiness Dashboard CI

on:
  pull_request:
    paths:
      - "motion-studio/scripts/profile-v1-assembly-preflight.mts"
      - "motion-studio/scripts/profile-v1-full-structure-review.mts"
      - "motion-studio/scripts/profile-v1-real-media-review.mts"
      - "motion-studio/scripts/profile-v1-audio-listening-review.mts"
      - "movie-dashboard/scripts/sync-profile-assembly-review-readiness.mjs"
      - "movie-dashboard/src/data/profileAssemblyReviewReadiness.generated.ts"
      - "movie-dashboard/src/components/ProfileAssemblyReviewReadinessPanel.tsx"
      - "movie-dashboard/src/components/ProfileReviewNextActionPanel.tsx"
      - "movie-dashboard/src/pages/MotionZukanWorkspaceHandoff.tsx"
      - ".github/workflows/profile-assembly-review-readiness-dashboard-ci.yml"
  push:
    branches: [main]
    paths:
      - "motion-studio/scripts/profile-v1-assembly-preflight.mts"
      - "motion-studio/scripts/profile-v1-full-structure-review.mts"
      - "motion-studio/scripts/profile-v1-real-media-review.mts"
      - "motion-studio/scripts/profile-v1-audio-listening-review.mts"
      - "movie-dashboard/scripts/sync-profile-assembly-review-readiness.mjs"
      - "movie-dashboard/src/data/profileAssemblyReviewReadiness.generated.ts"
      - "movie-dashboard/src/components/ProfileAssemblyReviewReadinessPanel.tsx"
      - "movie-dashboard/src/components/ProfileReviewNextActionPanel.tsx"
      - "movie-dashboard/src/pages/MotionZukanWorkspaceHandoff.tsx"
      - ".github/workflows/profile-assembly-review-readiness-dashboard-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: movie-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: movie-dashboard/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Generated Profile assembly review readiness is current
        run: node scripts/sync-profile-assembly-review-readiness.mjs
      - name: Contract tokens preserve Human QA and GUI Actual boundaries
        run: |
          grep -q 'FINAL_RENDER_ELIGIBLE != HUMAN_QA_COMPLETE' src/components/ProfileAssemblyReviewReadinessPanel.tsx
          grep -q 'STRUCTURE_PASS != REAL_MEDIA_PASS' src/components/ProfileAssemblyReviewReadinessPanel.tsx
          grep -q 'Remotion Studio GUI Actual = <strong>NOT_RUN</strong>' src/components/ProfileAssemblyReviewReadinessPanel.tsx
          grep -q 'Mac DaVinci GUI Actual = <strong>NOT_RUN</strong>' src/components/ProfileAssemblyReviewReadinessPanel.tsx
          grep -q 'PROFILE EXACT NEXT HUMAN QA GATE' src/components/ProfileReviewNextActionPanel.tsx
          grep -q 'pnpm render:profile-v1:structure-preview' src/components/ProfileReviewNextActionPanel.tsx
          grep -q 'pnpm render:profile-v1:real-media-preview' src/components/ProfileReviewNextActionPanel.tsx
          grep -q 'profile-v1-audio-listening-review.mts --strict' src/components/ProfileReviewNextActionPanel.tsx
          grep -q 'COMMAND_COPIED != COMMAND_EXECUTED' src/components/ProfileReviewNextActionPanel.tsx
          grep -q '<ProfileAssemblyReviewReadinessPanel />' src/pages/MotionZukanWorkspaceHandoff.tsx
          grep -q '<ProfileReviewNextActionPanel />' src/pages/MotionZukanWorkspaceHandoff.tsx
      - name: Typecheck and build Movie Dashboard
        run: pnpm build
