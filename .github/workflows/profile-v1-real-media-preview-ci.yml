name: Profile V1 Real Media Preview CI

on:
  pull_request:
    paths:
      - "motion-studio/public/profile/**"
      - "motion-studio/src/data/profileV1RuntimeMedia.generated.ts"
      - "motion-studio/src/data/profileV1FramingVerdicts.generated.ts"
      - "motion-studio/src/data/profileV1ProductionPlan.ts"
      - "motion-studio/src/components/common/mediaPresentation.ts"
      - "motion-studio/src/compositions/profile/ProfileV1RealMediaPreview.tsx"
      - "motion-studio/src/compositions/profile/ProfileV1RealMediaCropReview.tsx"
      - "motion-studio/src/ProfileV1Root.tsx"
      - "motion-studio/src/index-profile-v1.ts"
      - "motion-studio/scripts/check-profile-v1-real-media-preview.mts"
      - "motion-studio/scripts/profile-v1-media-input-gate.mts"
      - "motion-studio/scripts/render-profile-v1-real-media-preview.mts"
      - "motion-studio/scripts/render-profile-v1-real-media-qa-stills.mts"
      - "motion-studio/scripts/render-profile-v1-real-media-crop-review-stills.mts"
      - "motion-studio/scripts/sync-profile-v1-framing-verdicts.mts"
      - ".github/workflows/profile-v1-real-media-preview-ci.yml"
  push:
    branches: [main]
    paths:
      - "motion-studio/public/profile/**"
      - "motion-studio/src/data/profileV1RuntimeMedia.generated.ts"
      - "motion-studio/src/data/profileV1FramingVerdicts.generated.ts"
      - "motion-studio/src/data/profileV1ProductionPlan.ts"
      - "motion-studio/src/components/common/mediaPresentation.ts"
      - "motion-studio/src/compositions/profile/ProfileV1RealMediaPreview.tsx"
      - "motion-studio/src/compositions/profile/ProfileV1RealMediaCropReview.tsx"
      - "motion-studio/src/ProfileV1Root.tsx"
      - "motion-studio/src/index-profile-v1.ts"
      - "motion-studio/scripts/check-profile-v1-real-media-preview.mts"
      - "motion-studio/scripts/profile-v1-media-input-gate.mts"
      - "motion-studio/scripts/render-profile-v1-real-media-preview.mts"
      - "motion-studio/scripts/render-profile-v1-real-media-qa-stills.mts"
      - "motion-studio/scripts/render-profile-v1-real-media-crop-review-stills.mts"
      - "motion-studio/scripts/sync-profile-v1-framing-verdicts.mts"
      - ".github/workflows/profile-v1-real-media-preview-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: motion-studio
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: motion-studio/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript
        run: pnpm typecheck

      - name: Real-media preview contracts
        run: node --no-warnings scripts/check-profile-v1-real-media-preview.mts

      - name: Human framing verdicts remain fail closed
        run: |
          node --no-warnings scripts/sync-profile-v1-framing-verdicts.mts
          mkdir -p out/qa
          node --input-type=module <<'NODE'
          import {writeFileSync} from 'node:fs';
          writeFileSync('out/qa/profile-v1-real-media-review.json', JSON.stringify({
            media: [
              {
                slot: 'departure-airport',
                qa: {crop: 'PASS', focus: 'PASS'},
                framing: {fit: 'contain', focusX: 42, focusY: 58}
              },
              {
                slot: 'departure-runway',
                qa: {crop: 'NOT_RUN', focus: 'PASS'},
                framing: {fit: 'contain', focusX: 20, focusY: 30}
              },
              {
                slot: 'departure-window-clouds',
                qa: {crop: 'PASS', focus: 'PASS'},
                framing: {fit: 'cover', focusX: 150, focusY: 50}
              }
            ]
          }, null, 2));
          NODE
          node --no-warnings scripts/sync-profile-v1-framing-verdicts.mts --write
          grep -F "approvedCount: 1" src/data/profileV1FramingVerdicts.generated.ts
          grep -F '"departure-airport": {"fit":"contain","objectPosition":"42% 58%"},' src/data/profileV1FramingVerdicts.generated.ts
          grep -F '"departure-runway": null,' src/data/profileV1FramingVerdicts.generated.ts
          grep -F '"departure-window-clouds": null,' src/data/profileV1FramingVerdicts.generated.ts
          rm out/qa/profile-v1-real-media-review.json
          node --no-warnings scripts/sync-profile-v1-framing-verdicts.mts --write
          git diff --exit-code -- src/data/profileV1FramingVerdicts.generated.ts
          echo "Only Human crop+focus PASS with valid framing can reach generated Profile composition framing"

      - name: Production preview/stills fail closed without real inputs
        run: |
          if node --no-warnings scripts/profile-v1-media-input-gate.mts; then
            echo "media input gate unexpectedly passed on fresh clone"
            exit 1
          fi
          if node --no-warnings scripts/render-profile-v1-real-media-preview.mts; then
            echo "real-media preview unexpectedly rendered without 17 real media slots/current cleared BGM"
            exit 1
          fi
          if node --no-warnings scripts/render-profile-v1-real-media-qa-stills.mts; then
            echo "production QA stills unexpectedly rendered without 17 real media slots/current cleared BGM"
            exit 1
          fi
          if node --no-warnings scripts/render-profile-v1-real-media-crop-review-stills.mts --sample; then
            echo "crop-review stills unexpectedly rendered without 17 real media slots/current cleared BGM"
            exit 1
          fi
          echo "production Profile real-media evidence correctly fails closed without current real inputs"

      - name: Fresh clone missing-media visual smoke remains explicit
        run: |
          node --no-warnings scripts/render-profile-v1-real-media-qa-stills.mts --allow-missing-media-smoke
          test "$(find out/qa/profile-v1-real-media -name '*.png' | wc -l | tr -d ' ')" = "5"
          node --no-warnings scripts/render-profile-v1-real-media-crop-review-stills.mts --allow-missing-media-smoke --sample
          test "$(find out/qa/profile-v1-real-media-crop-review -name '*.png' | wc -l | tr -d ' ')" = "3"
          echo "Fresh clone renders explicit missing-media smoke frames only under CI-only bypass flags"

      - name: Upload real-media smoke stills
        uses: actions/upload-artifact@v4
        with:
          name: profile-v1-real-media-preview-smoke
          path: |
            motion-studio/out/qa/profile-v1-real-media/*.png
            motion-studio/out/qa/profile-v1-real-media-crop-review/*.png
          if-no-files-found: error
          retention-days: 7
