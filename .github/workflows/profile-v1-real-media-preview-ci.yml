name: Profile V1 Real Media Preview CI

on:
  pull_request:
    paths:
      - "motion-studio/public/profile/**"
      - "motion-studio/src/data/profileV1RuntimeMedia.generated.ts"
      - "motion-studio/src/data/profileV1ProductionPlan.ts"
      - "motion-studio/src/compositions/profile/ProfileV1RealMediaPreview.tsx"
      - "motion-studio/src/ProfileV1Root.tsx"
      - "motion-studio/src/index-profile-v1.ts"
      - "motion-studio/scripts/check-profile-v1-real-media-preview.mts"
      - "motion-studio/scripts/render-profile-v1-real-media-qa-stills.mts"
      - ".github/workflows/profile-v1-real-media-preview-ci.yml"
  push:
    branches: [main]
    paths:
      - "motion-studio/public/profile/**"
      - "motion-studio/src/data/profileV1RuntimeMedia.generated.ts"
      - "motion-studio/src/data/profileV1ProductionPlan.ts"
      - "motion-studio/src/compositions/profile/ProfileV1RealMediaPreview.tsx"
      - "motion-studio/src/ProfileV1Root.tsx"
      - "motion-studio/src/index-profile-v1.ts"
      - "motion-studio/scripts/check-profile-v1-real-media-preview.mts"
      - "motion-studio/scripts/render-profile-v1-real-media-qa-stills.mts"
      - ".github/workflows/profile-v1-real-media-preview-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: motion-studio
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: motion-studio/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript
        run: pnpm typecheck

      - name: Real-media preview contracts
        run: node --no-warnings scripts/check-profile-v1-real-media-preview.mts

      - name: Fresh clone visual smoke remains honest
        run: |
          node --no-warnings scripts/render-profile-v1-real-media-qa-stills.mts
          test "$(find out/qa/profile-v1-real-media -name '*.png' | wc -l | tr -d ' ')" = "5"
          echo "Fresh clone renders five explicit missing-media QA frames without fabricating Profile media"

      - name: Upload real-media QA stills
        uses: actions/upload-artifact@v4
        with:
          name: profile-v1-real-media-preview-qa
          path: motion-studio/out/qa/profile-v1-real-media/*.png
          if-no-files-found: error
          retention-days: 7
