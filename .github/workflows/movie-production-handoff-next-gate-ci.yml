name: Movie Production Handoff Next Gate CI

on:
  pull_request:
    paths:
      - 'movie-dashboard/src/data/openingProductionStatusHandoff.ts'
      - 'movie-dashboard/src/data/profileProductionStatusHandoff.ts'
      - 'movie-dashboard/src/data/remotionStudioActualToolingEvidence.ts'
      - 'movie-dashboard/src/lib/palmierWeddingProductionGate.ts'
      - 'movie-dashboard/src/lib/effectiveProductionHandoffExport.ts'
      - 'movie-dashboard/src/components/OpeningProductionHandoffExportButton.tsx'
      - 'movie-dashboard/src/components/ProfileProductionHandoffExportButton.tsx'
      - 'movie-dashboard/src/components/ProductionNextGateSummary.tsx'
      - 'movie-dashboard/src/components/EffectiveProductionNextGateSummary.tsx'
      - 'movie-dashboard/scripts/verify-production-handoff-next-gate-contracts.mjs'
      - 'movie-dashboard/scripts/verify-remotion-studio-tooling-handoff-contracts.mjs'
      - '.github/workflows/movie-production-handoff-next-gate-ci.yml'
  push:
    branches: [main]
    paths:
      - 'movie-dashboard/src/data/openingProductionStatusHandoff.ts'
      - 'movie-dashboard/src/data/profileProductionStatusHandoff.ts'
      - 'movie-dashboard/src/data/remotionStudioActualToolingEvidence.ts'
      - 'movie-dashboard/src/lib/palmierWeddingProductionGate.ts'
      - 'movie-dashboard/src/lib/effectiveProductionHandoffExport.ts'
      - 'movie-dashboard/src/components/OpeningProductionHandoffExportButton.tsx'
      - 'movie-dashboard/src/components/ProfileProductionHandoffExportButton.tsx'
      - 'movie-dashboard/src/components/ProductionNextGateSummary.tsx'
      - 'movie-dashboard/src/components/EffectiveProductionNextGateSummary.tsx'
      - 'movie-dashboard/scripts/verify-production-handoff-next-gate-contracts.mjs'
      - 'movie-dashboard/scripts/verify-remotion-studio-tooling-handoff-contracts.mjs'
      - '.github/workflows/movie-production-handoff-next-gate-ci.yml'

jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: movie-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: movie-dashboard/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: node scripts/verify-production-handoff-next-gate-contracts.mjs
      - run: node scripts/verify-remotion-studio-tooling-handoff-contracts.mjs
      - run: pnpm build
