name: Wedding Final Delivery Evidence Manifest CI

on:
  pull_request:
    paths:
      - 'motion-studio/scripts/wedding-final-delivery-evidence-manifest.mts'
      - 'motion-studio/scripts/check-wedding-final-delivery-evidence-manifest.mts'
      - '.github/workflows/wedding-final-delivery-evidence-manifest-ci.yml'
      - 'motion-studio/scripts/wedding-davinci-delivery-readiness.mts'
      - 'motion-studio/scripts/wedding-davinci-delivery-readiness-snapshot.mts'
      - 'motion-studio/scripts/wedding-davinci-actual-completion-receipt.mts'
      - 'motion-studio/scripts/wedding-final-approval-completion-binding.mts'
  push:
    branches: [main]
    paths:
      - 'motion-studio/scripts/wedding-final-delivery-evidence-manifest.mts'
      - 'motion-studio/scripts/check-wedding-final-delivery-evidence-manifest.mts'
      - '.github/workflows/wedding-final-delivery-evidence-manifest-ci.yml'
      - 'motion-studio/scripts/wedding-davinci-delivery-readiness.mts'
      - 'motion-studio/scripts/wedding-davinci-delivery-readiness-snapshot.mts'
      - 'motion-studio/scripts/wedding-davinci-actual-completion-receipt.mts'
      - 'motion-studio/scripts/wedding-final-approval-completion-binding.mts'

jobs:
  evidence-manifest-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: motion-studio
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: motion-studio/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Final delivery evidence manifest contract
        run: node --no-warnings scripts/check-wedding-final-delivery-evidence-manifest.mts
