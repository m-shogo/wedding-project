name: Movie Production Blocker Codes CI

on:
  pull_request:
    paths:
      - "motion-studio/scripts/opening-v1-production-status.mts"
      - "motion-studio/scripts/profile-v1-production-status.mts"
      - "motion-studio/scripts/check-production-status-blocker-codes.mts"
      - ".github/workflows/movie-production-blocker-codes-ci.yml"
  push:
    branches: [main]
    paths:
      - "motion-studio/scripts/opening-v1-production-status.mts"
      - "motion-studio/scripts/profile-v1-production-status.mts"
      - "motion-studio/scripts/check-production-status-blocker-codes.mts"
      - ".github/workflows/movie-production-blocker-codes-ci.yml"

permissions:
  contents: read

jobs:
  stable-blocker-codes:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: motion-studio
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: motion-studio/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Verify stable blocker code contract
        run: node --no-warnings scripts/check-production-status-blocker-codes.mts
