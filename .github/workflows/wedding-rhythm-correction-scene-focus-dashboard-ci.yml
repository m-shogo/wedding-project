name: Wedding Rhythm Correction Scene Focus Dashboard CI

on:
  pull_request:
    paths:
      - 'movie-dashboard/src/data/motionZukanSceneFocus.ts'
      - 'movie-dashboard/src/components/ProjectRhythmReviewOperator.tsx'
      - 'movie-dashboard/src/components/MotionZukanProductionWorkspace.tsx'
      - 'movie-dashboard/src/components/TypographySceneBoundElementComparison.tsx'
      - 'movie-dashboard/scripts/verify-rhythm-correction-scene-focus-contracts.mjs'
      - '.github/workflows/wedding-rhythm-correction-scene-focus-dashboard-ci.yml'
  workflow_dispatch:

jobs:
  rhythm-correction-scene-focus-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Guard revision-bound Scene focus contract
        run: node movie-dashboard/scripts/verify-rhythm-correction-scene-focus-contracts.mjs

      - name: Build Movie Dashboard
        working-directory: movie-dashboard
        run: |
          pnpm install --frozen-lockfile
          pnpm build
