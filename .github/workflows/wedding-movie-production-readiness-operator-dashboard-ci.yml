name: Wedding Movie Production Readiness Operator Dashboard CI

on:
  pull_request:
    paths:
      - 'movie-dashboard/src/components/WeddingMovieProductionReadinessOperatorCard.tsx'
      - 'movie-dashboard/src/components/WeddingMediaIntakeChecklistCard.tsx'
      - 'movie-dashboard/scripts/verify-production-readiness-operator-contracts.mjs'
      - '.github/workflows/wedding-movie-production-readiness-operator-dashboard-ci.yml'
  workflow_dispatch:

jobs:
  operator:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify production readiness operator contracts
        run: node movie-dashboard/scripts/verify-production-readiness-operator-contracts.mjs
      - name: Build Movie Dashboard
        working-directory: movie-dashboard
        run: |
          pnpm install --frozen-lockfile
          pnpm build
