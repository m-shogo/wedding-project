name: Movie Preview Review Init CI

on:
  pull_request:
    paths:
      - "motion-studio/package.json"
      - "motion-studio/scripts/init-profile-v1-real-media-review.mts"
      - "motion-studio/scripts/init-opening-v1-preview-review.mts"
      - "motion-studio/scripts/opening-v1-preview-source-fingerprint.mts"
      - "motion-studio/scripts/verify-preview-review-init-contracts.mts"
      - "motion-studio/scripts/verify-opening-preview-source-fingerprint-contracts.mts"
      - ".github/workflows/movie-preview-review-init-ci.yml"
  push:
    branches: [main]
    paths:
      - "motion-studio/package.json"
      - "motion-studio/scripts/init-profile-v1-real-media-review.mts"
      - "motion-studio/scripts/init-opening-v1-preview-review.mts"
      - "motion-studio/scripts/opening-v1-preview-source-fingerprint.mts"
      - "motion-studio/scripts/verify-preview-review-init-contracts.mts"
      - "motion-studio/scripts/verify-opening-preview-source-fingerprint-contracts.mts"
      - ".github/workflows/movie-preview-review-init-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: motion-studio
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: motion-studio/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify preview review initialization contracts
        run: node --no-warnings scripts/verify-preview-review-init-contracts.mts

      - name: Verify Opening preview render-source binding
        run: node --no-warnings scripts/verify-opening-preview-source-fingerprint-contracts.mts

      - name: Typecheck Motion Studio
        run: pnpm typecheck
