name: Wedding DaVinci Delivery Readiness CI

on:
  pull_request:
    paths:
      - "motion-studio/scripts/opening-v1-davinci-actual-binding-audit.mts"
      - "motion-studio/scripts/profile-v1-davinci-actual-binding-audit.mts"
      - "motion-studio/scripts/wedding-project-motion-provenance-preflight.mts"
      - "motion-studio/scripts/verify-wedding-project-motion-production-provenance.mts"
      - "motion-studio/scripts/wedding-davinci-delivery-readiness.mts"
      - "motion-studio/scripts/wedding-davinci-delivery-readiness-snapshot.mts"
      - "motion-studio/scripts/wedding-davinci-final-delivery-preflight.mts"
      - "movie-dashboard/scripts/sync-wedding-project-motion-provenance-preflight.mjs"
      - "movie-dashboard/src/data/weddingProjectMotionProvenancePreflight.generated.ts"
      - "movie-dashboard/src/data/openingDavinciActualBindingAudit.generated.ts"
      - "movie-dashboard/src/data/profileDavinciActualBindingAudit.generated.ts"
      - "movie-dashboard/src/data/openingProductionStatusHandoff.ts"
      - "movie-dashboard/src/data/profileProductionStatusHandoff.ts"
      - "movie-dashboard/src/data/weddingDavinciDeliveryReadiness.ts"
      - "movie-dashboard/src/data/weddingDavinciFinalDeliveryPreflight.ts"
      - "movie-dashboard/src/components/WeddingDavinciDeliveryReadinessCard.tsx"
      - "movie-dashboard/src/pages/VisualMotionLibrary.tsx"
      - "movie-dashboard/scripts/verify-wedding-davinci-delivery-readiness.mjs"
      - ".github/workflows/wedding-davinci-delivery-readiness-ci.yml"
  push:
    branches: [main]
    paths:
      - "motion-studio/scripts/opening-v1-davinci-actual-binding-audit.mts"
      - "motion-studio/scripts/profile-v1-davinci-actual-binding-audit.mts"
      - "motion-studio/scripts/wedding-project-motion-provenance-preflight.mts"
      - "motion-studio/scripts/verify-wedding-project-motion-production-provenance.mts"
      - "motion-studio/scripts/wedding-davinci-delivery-readiness.mts"
      - "motion-studio/scripts/wedding-davinci-delivery-readiness-snapshot.mts"
      - "motion-studio/scripts/wedding-davinci-final-delivery-preflight.mts"
      - "movie-dashboard/scripts/sync-wedding-project-motion-provenance-preflight.mjs"
      - "movie-dashboard/src/data/weddingProjectMotionProvenancePreflight.generated.ts"
      - "movie-dashboard/src/data/openingDavinciActualBindingAudit.generated.ts"
      - "movie-dashboard/src/data/profileDavinciActualBindingAudit.generated.ts"
      - "movie-dashboard/src/data/openingProductionStatusHandoff.ts"
      - "movie-dashboard/src/data/profileProductionStatusHandoff.ts"
      - "movie-dashboard/src/data/weddingDavinciDeliveryReadiness.ts"
      - "movie-dashboard/src/data/weddingDavinciFinalDeliveryPreflight.ts"
      - "movie-dashboard/src/components/WeddingDavinciDeliveryReadinessCard.tsx"
      - "movie-dashboard/src/pages/VisualMotionLibrary.tsx"
      - "movie-dashboard/scripts/verify-wedding-davinci-delivery-readiness.mjs"
      - ".github/workflows/wedding-davinci-delivery-readiness-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: movie-dashboard/pnpm-lock.yaml
      - name: Verify cross-project readiness command, Project Motion dashboard snapshot, and Motion Zukan final delivery surface
        working-directory: movie-dashboard
        run: node scripts/verify-wedding-davinci-delivery-readiness.mjs
      - name: Install Movie Dashboard dependencies
        working-directory: movie-dashboard
        run: pnpm install --frozen-lockfile
      - name: Typecheck and build Movie Dashboard
        working-directory: movie-dashboard
        run: pnpm build
