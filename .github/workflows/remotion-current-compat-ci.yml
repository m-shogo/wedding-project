name: Remotion Current Compatibility CI

on:
  pull_request:
    paths:
      - "motion-studio/src/data/remotionCurrentCompatibility.ts"
      - "motion-studio/scripts/check-remotion-current-compat.mts"
      - "docs/research/2026-08-26-movie-tool-learning-run-40-remotion-current-compat.md"
      - ".github/workflows/remotion-current-compat-ci.yml"
  push:
    paths:
      - "motion-studio/src/data/remotionCurrentCompatibility.ts"
      - "motion-studio/scripts/check-remotion-current-compat.mts"
      - "docs/research/2026-08-26-movie-tool-learning-run-40-remotion-current-compat.md"
      - ".github/workflows/remotion-current-compat-ci.yml"

permissions:
  contents: read

jobs:
  latest-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: motion-studio/pnpm-lock.yaml

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Install locked baseline
        working-directory: motion-studio
        run: pnpm install --frozen-lockfile

      - name: Verify baseline/current contract
        working-directory: motion-studio
        run: node --no-warnings scripts/check-remotion-current-compat.mts

      - name: Baseline typecheck
        working-directory: motion-studio
        run: pnpm typecheck

      - name: Ephemerally install Remotion 4.0.517 family
        working-directory: motion-studio
        run: |
          cp package.json /tmp/remotion-package-baseline.json
          cp pnpm-lock.yaml /tmp/remotion-lock-baseline.yaml
          pnpm add --save-exact \
            remotion@4.0.517 \
            @remotion/cli@4.0.517 \
            @remotion/google-fonts@4.0.517 \
            @remotion/paths@4.0.517 \
            @remotion/zod-types@4.0.517
          git diff -- package.json pnpm-lock.yaml > /tmp/remotion-4.0.517-ephemeral.diff
          test -s /tmp/remotion-4.0.517-ephemeral.diff
          echo 'EPHEMERAL_CI_GREEN != PRODUCTION_LOCKFILE_UPGRADED'

      - name: Verify all direct Remotion packages resolve to 4.0.517
        working-directory: motion-studio
        run: |
          node <<'NODE'
          const expected = '4.0.517';
          for (const pkg of ['remotion','@remotion/cli','@remotion/google-fonts','@remotion/paths','@remotion/zod-types']) {
            const actual = require(`./node_modules/${pkg}/package.json`).version;
            console.log(`${pkg}=${actual}`);
            if (actual !== expected) process.exitCode = 1;
          }
          NODE

      - name: Latest TypeScript compatibility
        working-directory: motion-studio
        run: pnpm typecheck

      - name: Latest canonical motion contracts
        working-directory: motion-studio
        run: |
          pnpm check:motion
          pnpm check:assets
          pnpm check:parts
          pnpm check:presets
          pnpm check:director-recipes

      - name: Latest composition discovery
        working-directory: motion-studio
        run: pnpm director-recipes:list > /tmp/remotion-latest-compositions.txt

      - name: Latest neutral render smoke
        working-directory: motion-studio
        run: |
          rm -f out/common/stamp_test_preview.mp4
          pnpm render:stamp-test:preview
          test -f out/common/stamp_test_preview.mp4
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate -show_entries format=duration -of json out/common/stamp_test_preview.mp4 > /tmp/remotion-latest-render.json
          grep -Fq '"codec_name": "h264"' /tmp/remotion-latest-render.json
          grep -Fq '"width": 1920' /tmp/remotion-latest-render.json
          grep -Fq '"height": 1080' /tmp/remotion-latest-render.json

      - name: Production dependency files were only mutated ephemerally
        working-directory: motion-studio
        run: |
          test -s /tmp/remotion-4.0.517-ephemeral.diff
          cmp -s /tmp/remotion-package-baseline.json package.json && {
            echo 'Expected the CI-only pnpm add to modify package.json in the runner';
            exit 1;
          }
          echo 'latestCompatibilityCandidate=4.0.517'
          echo 'repoLockedBaseline=4.0.475'
          echo 'productionUpgradePerformed=NO'
          echo 'runtimeStudioManualQA=STILL_REQUIRED_BEFORE_PRODUCTION_UPGRADE'
