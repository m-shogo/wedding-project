name: Mask Reveal Local DaVinci Gate CI

on:
  pull_request:
    paths:
      - "scripts/davinci/mask-reveal-readonly-probe.sh"
      - "docs/runbooks/2026-08-25-mask-reveal-local-davinci-actual-gate.md"
      - "docs/runbooks/2026-08-25-mask-reveal-human-master-actual-addendum.md"
      - "docs/runbooks/2026-08-25-mask-reveal-davinci-applied-evidence-gate.md"
      - "docs/decisions/2026-08-26-motion-zukan-property-stack-customization.md"
      - "docs/prompts/2026-08-25-mask-reveal-local-execution-agent.md"
      - "movie-dashboard/src/data/humanEditableMotionIntent.ts"
      - "movie-dashboard/src/data/maskRevealEditableProduction.ts"
      - "movie-dashboard/src/data/maskRevealPresetBridge.ts"
      - "movie-dashboard/src/data/maskRevealDaVinciAppliedEvidence.ts"
      - "movie-dashboard/src/data/maskRevealSceneProductionBundle.ts"
      - "movie-dashboard/scripts/verify-mask-reveal-davinci-applied-evidence-contracts.mjs"
      - ".github/workflows/mask-reveal-local-gate-ci.yml"

permissions:
  contents: read

jobs:
  validate-local-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Shell syntax
        run: bash -n scripts/davinci/mask-reveal-readonly-probe.sh

      - name: Read-only probe contract
        shell: bash
        run: |
          probe="scripts/davinci/mask-reveal-readonly-probe.sh"
          grep -Fq 'mutationsPerformed=NO' "$probe"
          grep -Fq 'This script does NOT launch Resolve, install an MCP, edit config, or write project files.' "$probe"
          if grep -Eq '(^|[[:space:]])(curl|wget|npx|rm|mv|cp)([[:space:]]|$)|npm[[:space:]]+(install|i)([[:space:]]|$)|defaults[[:space:]]+write' "$probe"; then
            echo "Read-only probe contains a forbidden mutating/network command"
            exit 1
          fi

      - name: Actual truth boundary contract
        shell: bash
        run: |
          runbook="docs/runbooks/2026-08-25-mask-reveal-local-davinci-actual-gate.md"
          prompt="docs/prompts/2026-08-25-mask-reveal-local-execution-agent.md"
          grep -Fq 'ACTUAL_DAVINCI_RENDER' "$runbook"
          grep -Fq 'PALMIER_TIMING_ONLY' "$runbook"
          grep -Fq 'VML_MASK_REVEAL_OPENING_INTRO' "$runbook"
          grep -Fq 'Do not claim DaVinci Actual before a file rendered by local DaVinci exists.' "$prompt"
          grep -Fq 'Do not claim Palmier XML before Palmier exports a real timeline XML.' "$prompt"
          grep -Fq 'Do not expand to new Motion Patterns until this vertical slice passes.' "$prompt"

      - name: Human Master editable Actual gate
        shell: bash
        run: |
          addendum="docs/runbooks/2026-08-25-mask-reveal-human-master-actual-addendum.md"
          editable="movie-dashboard/src/data/humanEditableMotionIntent.ts"
          production="movie-dashboard/src/data/maskRevealEditableProduction.ts"
          grep -Fq 'authority = HUMAN_MASTER' "$addendum"
          grep -Fq 'HUMAN_SELECTED' "$addendum"
          grep -Fq 'LOCKED' "$addendum"
          grep -Fq 'Human Decision' "$addendum"
          grep -Fq 'Palmier Applied Value' "$addendum"
          grep -Fq 'Difference / Delta' "$addendum"
          grep -Fq 'Actual DaVinci MP4' "$addendum"
          grep -Fq 'Implementation Evidence' "$addendum"
          grep -Fq 'Source of Truth' "$addendum"
          grep -Fq 'Property-local correction gate' "$addendum"
          grep -Fq '"DEFAULT" | "AI_SUGGESTED" | "HUMAN_SELECTED" | "LOCKED"' "$editable"
          grep -Fq 'if (current.locked) return intent' "$editable"
          grep -Fq 'authority: "HUMAN_MASTER"' "$production"
          grep -Fq 'palmierDeltaEvidence' "$production"

      - name: Applied-value and property-local evidence contract
        run: node movie-dashboard/scripts/verify-mask-reveal-davinci-applied-evidence-contracts.mjs
