name: Fusion Wedding Production Authority CI

on:
  pull_request:
    paths:
      - "movie-dashboard/src/pages/FusionNodeTranslator.tsx"
      - "movie-dashboard/src/lib/palmierWeddingProductionGate.ts"
      - "movie-dashboard/src/lib/davinciWeddingProductionRecovery.ts"
      - "movie-dashboard/src/data/openingProductionStatusHandoff.ts"
      - "movie-dashboard/src/data/profileProductionStatusHandoff.ts"
      - "movie-dashboard/scripts/verify-fusion-production-authority-contracts.mjs"
      - ".github/workflows/fusion-production-authority-ci.yml"
  push:
    branches: [main]
    paths:
      - "movie-dashboard/src/pages/FusionNodeTranslator.tsx"
      - "movie-dashboard/src/lib/palmierWeddingProductionGate.ts"
      - "movie-dashboard/src/lib/davinciWeddingProductionRecovery.ts"
      - "movie-dashboard/src/data/openingProductionStatusHandoff.ts"
      - "movie-dashboard/src/data/profileProductionStatusHandoff.ts"
      - "movie-dashboard/scripts/verify-fusion-production-authority-contracts.mjs"
      - ".github/workflows/fusion-production-authority-ci.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: movie-dashboard/pnpm-lock.yaml
      - name: Install dashboard dependencies
        working-directory: movie-dashboard
        run: pnpm install --frozen-lockfile
      - name: Verify Fusion Wedding production authority
        working-directory: movie-dashboard
        run: node scripts/verify-fusion-production-authority-contracts.mjs
      - name: Build dashboard
        working-directory: movie-dashboard
        run: pnpm build
