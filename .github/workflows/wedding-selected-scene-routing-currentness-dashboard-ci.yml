name: Wedding Selected Scene Routing Currentness Dashboard CI

on:
  pull_request:
    paths:
      - 'movie-dashboard/src/components/SelectedSceneRenderProjectCard.tsx'
      - 'movie-dashboard/src/data/typographyProductionSelectionStore.ts'
      - 'movie-dashboard/src/data/typographyProductionRoleContextStore.ts'
      - 'movie-dashboard/scripts/verify-selected-scene-routing-currentness.mjs'
      - '.github/workflows/wedding-selected-scene-routing-currentness-dashboard-ci.yml'
  workflow_dispatch:

jobs:
  selected-scene-routing-currentness-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Guard Human routing currentness
        run: node movie-dashboard/scripts/verify-selected-scene-routing-currentness.mjs

      - name: Build Movie Dashboard
        working-directory: movie-dashboard
        run: |
          pnpm install --frozen-lockfile
          pnpm build
