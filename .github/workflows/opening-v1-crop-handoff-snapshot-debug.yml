name: Opening V1 Crop Handoff Snapshot Debug

on:
  pull_request:
    paths:
      - 'motion-studio/scripts/opening-v1-production-status.mts'
      - 'motion-studio/scripts/opening-v1-davinci-handoff-contract.mts'
      - 'movie-dashboard/scripts/sync-opening-production-status.mjs'
      - 'movie-dashboard/src/data/openingProductionStatus.generated.ts'
      - '.github/workflows/opening-v1-crop-handoff-snapshot-debug.yml'

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: movie-dashboard/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: movie-dashboard
      - name: Generate canonical snapshot for diagnosis
        working-directory: movie-dashboard
        run: |
          node scripts/sync-opening-production-status.mjs --write
          echo '---BEGIN GENERATED SNAPSHOT---'
          cat src/data/openingProductionStatus.generated.ts
          echo '---END GENERATED SNAPSHOT---'
