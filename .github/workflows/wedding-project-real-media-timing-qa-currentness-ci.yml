name: Wedding Project Real Media Timing QA Currentness CI

on:
  pull_request:
    paths:
      - 'motion-studio/scripts/compare-wedding-project-real-media-timing-qa-stills.mts'
      - 'motion-studio/scripts/verify-wedding-project-real-media-timing-qa-comparison-currentness.mts'
      - '.github/workflows/wedding-project-real-media-timing-qa-currentness-ci.yml'
  workflow_dispatch:

jobs:
  timing-currentness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build timing comparison with real referenced still files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/timing-currentness
          for side in before after; do for kind in start mid end; do printf "$side-$kind" > "/tmp/timing-currentness/$side-$kind.png"; done; done
          node --input-type=module <<'NODE'
          import {createHash} from 'node:crypto'; import {readFileSync,writeFileSync} from 'node:fs';
          const sha=(p)=>createHash('sha256').update(readFileSync(p)).digest('hex');
          const mk=(side,sourceRevision,timingRevision,seconds,frames)=>{
            const framing={fit:'COVER',focusX:50,focusY:45,scale:1.1,revision:'framing-current'};
            const timing={sceneId:'scene-a',sourceRevision,targetDurationSeconds:seconds,computedDurationSeconds:seconds,durationFrames:frames,fps:30,revision:timingRevision};
            const samples=[['SCENE_START_SAFE','start',2],['SCENE_MID','mid',Math.floor((frames-1)/2)],['SCENE_END_SAFE','end',frames-3]];
            return {schemaVersion:'wedding-movie-real-media-preview-qa-stills/v1',authority:'DERIVED_VISUAL_QA_ARTIFACTS_FROM_CURRENT_REAL_MEDIA_PREVIEW',projectId:'opening',source:{previewSha256:`preview-${side}`},stills:samples.map(([kind,file,frame])=>{const path=`/tmp/timing-currentness/${side}-${file}.png`;return {kind,sceneId:'scene-a',sourceRevision,patternId:'type-mask-reveal',productionRole:'TITLE_REVEAL',mediaSha256:'same-media',framing,framingRevision:framing.revision,timing,timingRevision:timing.revision,frame,seconds:Number(frame)/30,path,sha256:sha(path)};}),transitionStills:[],summary:{sourceCurrentVerified:true,framingCurrentVerified:true,timingCurrentVerified:true,humanVisualQa:'NOT_RUN',productionReady:false},evidenceBoundary:{visualQa:'NOT_RUN',remotionStudioGuiActual:'NOT_RUN',palmierGuiActual:'NOT_RUN',macDaVinciGuiActual:'NOT_RUN'}};
          };
          writeFileSync('/tmp/timing-currentness/before.json',JSON.stringify(mk('before','scene-r1','timing-r1',1,30),null,2));
          writeFileSync('/tmp/timing-currentness/after.json',JSON.stringify(mk('after','scene-r2','timing-r2',1.4,42),null,2));
          const selected={schemaVersion:'wedding-movie-selected-scene-render-manifest/v1',authority:'DERIVED_FROM_CURRENT_PROJECT_TYPOGRAPHY_BATCH',projectId:'opening',scenes:[{sceneId:'scene-a',sourceRevision:'scene-r2',patternId:'type-mask-reveal',productionRole:'TITLE_REVEAL',timing:{sceneId:'scene-a',sourceRevision:'scene-r2',targetDurationSeconds:1.4,computedDurationSeconds:1.4,durationFrames:42,fps:30,revision:'timing-r2'}}],summary:{allSelectionsCurrent:true,timingBoundScenes:1,productionReady:false}};
          writeFileSync('/tmp/timing-currentness/selected.json',JSON.stringify(selected,null,2));
          NODE
          node --no-warnings motion-studio/scripts/compare-wedding-project-real-media-timing-qa-stills.mts --before-manifest=/tmp/timing-currentness/before.json --after-manifest=/tmp/timing-currentness/after.json --require-timing-change --output=/tmp/timing-currentness/receipt.json
      - name: Current comparison passes strict-current
        run: node --no-warnings motion-studio/scripts/verify-wedding-project-real-media-timing-qa-comparison-currentness.mts --receipt=/tmp/timing-currentness/receipt.json --current-selected=/tmp/timing-currentness/selected.json --strict-current --output=/tmp/timing-currentness/currentness.json
      - name: Verify CURRENT result and evidence boundary
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs'; const r=JSON.parse(readFileSync('/tmp/timing-currentness/currentness.json','utf8'));
          if(r.state!=='CURRENT'||!r.checks.currentSelectedTimingCurrent||!r.checks.stillFilesCurrent||r.mismatches.length) throw new Error('not current');
          if(r.evidenceBoundary.humanVisualReviewPerformed!==false||r.evidenceBoundary.remotionStudioGuiActual!=='NOT_RUN'||r.evidenceBoundary.palmierGuiActual!=='NOT_RUN'||r.evidenceBoundary.macDaVinciGuiActual!=='NOT_RUN') throw new Error('actual boundary');
          NODE
      - name: Later Human timing edit makes old comparison STALE
        shell: bash
        run: |
          cp /tmp/timing-currentness/selected.json /tmp/timing-currentness/selected-newer.json
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs'; const p='/tmp/timing-currentness/selected-newer.json'; const s=JSON.parse(readFileSync(p,'utf8')); s.scenes[0].sourceRevision='scene-r3'; s.scenes[0].timing={...s.scenes[0].timing,sourceRevision:'scene-r3',targetDurationSeconds:1.7,computedDurationSeconds:1.7,durationFrames:51,revision:'timing-r3'}; writeFileSync(p,JSON.stringify(s));
          NODE
          if node --no-warnings motion-studio/scripts/verify-wedding-project-real-media-timing-qa-comparison-currentness.mts --receipt=/tmp/timing-currentness/receipt.json --current-selected=/tmp/timing-currentness/selected-newer.json --strict-current --output=/tmp/timing-currentness/stale-selected.json; then echo 'expected selected timing drift to fail' >&2; exit 1; fi
          grep -q 'CURRENT_SELECTED_SOURCE_REVISION_DRIFT\|CURRENT_SELECTED_TIMING_DRIFT' /tmp/timing-currentness/stale-selected.json
      - name: Referenced still tamper makes comparison STALE
        shell: bash
        run: |
          printf tamper >> /tmp/timing-currentness/after-mid.png
          if node --no-warnings motion-studio/scripts/verify-wedding-project-real-media-timing-qa-comparison-currentness.mts --receipt=/tmp/timing-currentness/receipt.json --current-selected=/tmp/timing-currentness/selected.json --strict-current --output=/tmp/timing-currentness/stale-still.json; then echo 'expected still drift to fail' >&2; exit 1; fi
          grep -q 'STILL_SHA_DRIFT' /tmp/timing-currentness/stale-still.json
