name: Palmier Wedding Production Gate CI

on:
  pull_request:
    paths:
      - "movie-dashboard/src/pages/PalmierHandoff.tsx"
      - "movie-dashboard/src/lib/palmierWeddingProductionGate.ts"
      - "movie-dashboard/src/data/openingProductionStatusHandoff.ts"
      - "movie-dashboard/src/data/profileProductionStatusHandoff.ts"
      - "movie-dashboard/src/data/remotionStudioActualToolingEvidence.ts"
      - "movie-dashboard/scripts/verify-palmier-wedding-production-gate-contracts.mjs"
      - "movie-dashboard/scripts/verify-remotion-studio-tooling-handoff-contracts.mjs"
      - ".github/workflows/palmier-wedding-production-gate-ci.yml"
  push:
    branches: [main]
    paths:
      - "movie-dashboard/src/pages/PalmierHandoff.tsx"
      - "movie-dashboard/src/lib/palmierWeddingProductionGate.ts"
      - "movie-dashboard/src/data/openingProductionStatusHandoff.ts"
      - "movie-dashboard/src/data/profileProductionStatusHandoff.ts"
      - "movie-dashboard/src/data/remotionStudioActualToolingEvidence.ts"
      - "movie-dashboard/scripts/verify-palmier-wedding-production-gate-contracts.mjs"
      - "movie-dashboard/scripts/verify-remotion-studio-tooling-handoff-contracts.mjs"
      - ".github/workflows/palmier-wedding-production-gate-ci.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: movie-dashboard/pnpm-lock.yaml
      - name: Install dashboard dependencies
        working-directory: movie-dashboard
        run: pnpm install --frozen-lockfile
      - name: Verify Palmier Wedding production authority
        working-directory: movie-dashboard
        run: node scripts/verify-palmier-wedding-production-gate-contracts.mjs
      - name: Verify Remotion Studio tooling handoff
        working-directory: movie-dashboard
        run: node scripts/verify-remotion-studio-tooling-handoff-contracts.mjs
      - name: Build dashboard
        working-directory: movie-dashboard
        run: pnpm build
