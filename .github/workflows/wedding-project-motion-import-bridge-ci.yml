name: Wedding Project Motion Import Bridge CI

on:
  pull_request:
    paths:
      - 'motion-studio/src/data/weddingProjectMotionImport.ts'
      - 'motion-studio/src/data/weddingDavinciProductionRecovery.ts'
      - 'motion-studio/scripts/wedding-project-motion-artifact-store.mts'
      - 'motion-studio/scripts/wedding-project-motion-import-receipt.mts'
      - 'motion-studio/scripts/wedding-project-motion-import-currentness.mts'
      - 'motion-studio/scripts/export-wedding-production-handoff.mts'
      - 'motion-studio/scripts/check-wedding-project-motion-import-bridge.mts'
      - 'motion-studio/scripts/check-wedding-project-motion-recovery-gate.mts'
      - 'motion-studio/scripts/check-wedding-project-motion-import-receipt.mts'
      - 'motion-studio/scripts/check-wedding-project-motion-import-currentness.mts'
      - 'motion-studio/scripts/check-wedding-project-motion-canonical-artifacts.mts'
      - 'motion-studio/scripts/check-wedding-production-handoff-project-motion-gate.mts'
      - '.github/workflows/wedding-project-motion-import-bridge-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: motion-studio/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: motion-studio
        run: pnpm install --frozen-lockfile
      - name: Verify project Motion import bridge
        working-directory: motion-studio
        run: node --no-warnings scripts/check-wedding-project-motion-import-bridge.mts
      - name: Verify project Motion recovery gate
        working-directory: motion-studio
        run: node --no-warnings scripts/check-wedding-project-motion-recovery-gate.mts
      - name: Verify SHA-bound project Motion import receipt
        working-directory: motion-studio
        run: node --no-warnings scripts/check-wedding-project-motion-import-receipt.mts
      - name: Verify project Motion import receipt currentness
        working-directory: motion-studio
        run: node --no-warnings scripts/check-wedding-project-motion-import-currentness.mts
      - name: Verify canonical project Motion artifacts
        working-directory: motion-studio
        run: node --no-warnings scripts/check-wedding-project-motion-canonical-artifacts.mts
      - name: Verify production handoff blocks stale or non-actionable Project Motion receipts
        working-directory: motion-studio
        run: node --no-warnings scripts/check-wedding-production-handoff-project-motion-gate.mts
      - name: TypeScript
        working-directory: motion-studio
        run: pnpm typecheck
