name: Wedding Project Real Media Framing QA Comparison CI

on:
  pull_request:
    paths:
      - 'motion-studio/scripts/compare-wedding-project-real-media-framing-qa-stills.mts'
      - 'motion-studio/scripts/wedding-project-real-media-preview-qa-stills.mts'
      - '.github/workflows/wedding-project-real-media-framing-qa-comparison-ci.yml'
  workflow_dispatch:

jobs:
  framing-before-after:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Build framing-bound before/after QA manifests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/framing-compare
          node --input-type=module <<'NODE'
          import {writeFileSync} from 'node:fs';
          const boundary={visualQa:'NOT_RUN',remotionStudioGuiActual:'NOT_RUN',palmierGuiActual:'NOT_RUN',macDaVinciGuiActual:'NOT_RUN',productionReady:false};
          const framing=(focusX,revision)=>({fit:'COVER',focusX,focusY:50,scale:1,revision});
          const build=(focusX,revision,prefix)=>({
            schemaVersion:'wedding-movie-real-media-preview-qa-stills/v1',
            authority:'DERIVED_VISUAL_QA_ARTIFACTS_FROM_CURRENT_REAL_MEDIA_PREVIEW',
            projectId:'opening',
            source:{previewSha256:`${prefix}-preview`},
            summary:{sourceCurrentVerified:true,framingCurrentVerified:true,humanVisualQa:'NOT_RUN',productionReady:false},
            evidenceBoundary:boundary,
            stills:['SCENE_START_SAFE','SCENE_MID','SCENE_END_SAFE'].map((kind,index)=>({kind,sceneId:'scene-a',sourceRevision:'rev-a',patternId:'type-mask-reveal',productionRole:'TITLE_REVEAL',mediaSha256:'same-media-sha',framing:framing(focusX,revision),framingRevision:revision,frame:index*10,path:`/tmp/${prefix}-${kind}.png`,sha256:`${prefix}-${kind}-sha`})),
            transitionStills:[]
          });
          writeFileSync('/tmp/framing-compare/before.json',JSON.stringify(build(50,'rev-a__cover__x50__y50__s1','before')));
          writeFileSync('/tmp/framing-compare/after.json',JSON.stringify(build(25,'rev-a__cover__x25__y50__s1','after')));
          NODE
      - name: Framing-only correction produces before/after receipt
        run: node --no-warnings motion-studio/scripts/compare-wedding-project-real-media-framing-qa-stills.mts --before-manifest=/tmp/framing-compare/before.json --after-manifest=/tmp/framing-compare/after.json --require-framing-change --output=/tmp/framing-compare/receipt.json
      - name: Verify comparison remains mechanical NOT_RUN evidence
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const receipt=JSON.parse(readFileSync('/tmp/framing-compare/receipt.json','utf8'));
          if(receipt.schemaVersion!=='wedding-movie-real-media-framing-qa-comparison/v1') throw new Error('schema');
          if(receipt.summary.framingChangedScenes!==1||receipt.summary.sameSceneAndMediaAuthorityVerified!==true) throw new Error('comparison summary');
          if(receipt.scenes[0].before.framingRevision===receipt.scenes[0].after.framingRevision) throw new Error('framing revision did not change');
          if(receipt.evidenceBoundary.humanVisualReviewPerformed!==false||receipt.summary.humanVisualQa!=='NOT_RUN'||receipt.evidenceBoundary.productionReady!==false) throw new Error('evidence boundary');
          NODE
      - name: Media drift fails closed
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          const value=JSON.parse(readFileSync('/tmp/framing-compare/after.json','utf8'));
          value.stills.forEach((row)=>row.mediaSha256='changed-media-sha');
          writeFileSync('/tmp/framing-compare/after-media-drift.json',JSON.stringify(value));
          NODE
          if node --no-warnings motion-studio/scripts/compare-wedding-project-real-media-framing-qa-stills.mts --before-manifest=/tmp/framing-compare/before.json --after-manifest=/tmp/framing-compare/after-media-drift.json --require-framing-change 2>/tmp/framing-compare/media.err; then
            echo 'expected media drift to fail closed' >&2
            exit 1
          fi
          grep -q 'REAL_MEDIA_FRAMING_COMPARE_MEDIA_CHANGED' /tmp/framing-compare/media.err
      - name: No framing correction fails when change is required
        shell: bash
        run: |
          if node --no-warnings motion-studio/scripts/compare-wedding-project-real-media-framing-qa-stills.mts --before-manifest=/tmp/framing-compare/before.json --after-manifest=/tmp/framing-compare/before.json --require-framing-change 2>/tmp/framing-compare/no-change.err; then
            echo 'expected no-change comparison to fail closed' >&2
            exit 1
          fi
          grep -q 'REAL_MEDIA_FRAMING_COMPARE_NO_FRAMING_CHANGE' /tmp/framing-compare/no-change.err
