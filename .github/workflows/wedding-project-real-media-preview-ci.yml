name: Wedding Project Real Media Preview CI

on:
  pull_request:
    paths:
      - 'motion-studio/scripts/render-wedding-project-real-media-preview.mts'
      - 'motion-studio/src/compositions/common/WeddingProjectTypographyPreviewReel.tsx'
      - 'motion-studio/src/compositions/common/VisualMotionTypographyConcepts.tsx'
      - '.github/workflows/wedding-project-real-media-preview-ci.yml'
  workflow_dispatch:

jobs:
  real-media-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Motion Studio dependencies
        working-directory: motion-studio
        run: pnpm install --frozen-lockfile
      - name: Build real media / BGM / authority fixtures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/real-preview
          printf '{"fixture":"current-batch"}\n' > /tmp/real-preview/batch.json
          ffmpeg -hide_banner -loglevel error -f lavfi -i color=c=0x335577:s=1280x720 -frames:v 1 -y /tmp/real-preview/scene-a.jpg
          ffmpeg -hide_banner -loglevel error -f lavfi -i color=c=0x884455:s=1280x720:d=2 -r 30 -c:v libx264 -pix_fmt yuv420p -y /tmp/real-preview/scene-b.mp4
          ffmpeg -hide_banner -loglevel error -f lavfi -i sine=frequency=440:sample_rate=48000:duration=2 -ac 2 -y /tmp/real-preview/bgm.wav
          BATCH_SHA=$(sha256sum /tmp/real-preview/batch.json | awk '{print $1}')
          A_SHA=$(sha256sum /tmp/real-preview/scene-a.jpg | awk '{print $1}')
          B_SHA=$(sha256sum /tmp/real-preview/scene-b.mp4 | awk '{print $1}')
          BGM_SHA=$(sha256sum /tmp/real-preview/bgm.wav | awk '{print $1}')
          cat > /tmp/real-preview/selected.json <<JSON
          {
            "schemaVersion":"wedding-movie-selected-scene-render-manifest/v1",
            "authority":"DERIVED_FROM_CURRENT_PROJECT_TYPOGRAPHY_BATCH",
            "projectId":"opening",
            "sourceBatch":{"path":"/tmp/real-preview/batch.json","sha256":"${BATCH_SHA}"},
            "scenes":[
              {"order":1,"sceneId":"scene-a","sourceRevision":"rev-a","patternId":"type-mask-reveal","productionRole":"TITLE_REVEAL","selectionClass":"PRIMARY","timeline":{"startSeconds":0,"endSeconds":1,"frames":30},"props":{"text":"OUR JOURNEY","mode":"mask","intensity":"S","label":"OPENING A"}},
              {"order":2,"sceneId":"scene-b","sourceRevision":"rev-b","patternId":"split-rise","productionRole":"IMPACT_TITLE","selectionClass":"PRIMARY","timeline":{"startSeconds":1,"endSeconds":2,"frames":30},"props":{"text":"READY FOR TAKEOFF","mode":"punch","intensity":"M","label":"OPENING B"}}
            ],
            "transitions":[{"fromSceneId":"scene-a","toSceneId":"scene-b","transition":"CROSS_DISSOLVE","durationFrames":6,"sourceStatus":"HUMAN_SELECTED_CURRENT"}],
            "summary":{"allSelectionsCurrent":true,"productionReady":false},
            "evidenceBoundary":{"remotionStudioGuiActual":"NOT_RUN","palmierGuiActual":"NOT_RUN","macDaVinciGuiActual":"NOT_RUN"}
          }
          JSON
          cat > /tmp/real-preview/audit.json <<JSON
          {
            "schemaVersion":"wedding-movie-production-readiness-audit/v1",
            "authority":"DERIVED_FROM_CURRENT_HUMAN_MASTER_AND_REAL_MEDIA_BINDINGS",
            "projectId":"opening",
            "source":{"batchSha256":"${BATCH_SHA}"},
            "scenes":[
              {"sceneId":"scene-a","sourceRevision":"rev-a","patternId":"type-mask-reveal","productionRole":"TITLE_REVEAL","readiness":"READY_FOR_REAL_MEDIA_PREVIEW","media":{"state":"CURRENT","path":"/tmp/real-preview/scene-a.jpg","sha256":"${A_SHA}","kind":"IMAGE"}},
              {"sceneId":"scene-b","sourceRevision":"rev-b","patternId":"split-rise","productionRole":"IMPACT_TITLE","readiness":"READY_FOR_REAL_MEDIA_PREVIEW","media":{"state":"CURRENT","path":"/tmp/real-preview/scene-b.mp4","sha256":"${B_SHA}","kind":"VIDEO"}}
            ],
            "audio":{"state":"CURRENT","path":"/tmp/real-preview/bgm.wav","sha256":"${BGM_SHA}"},
            "summary":{"readyForContinuousRealMediaPreview":true,"productionReady":false},
            "evidenceBoundary":{"remotionStudioGuiActual":"NOT_RUN","palmierGuiActual":"NOT_RUN","macDaVinciGuiActual":"NOT_RUN","productionReady":false}
          }
          JSON
      - name: Render 2-scene real-media preview smoke
        run: node --no-warnings motion-studio/scripts/render-wedding-project-real-media-preview.mts --selected-manifest=/tmp/real-preview/selected.json --readiness-audit=/tmp/real-preview/audit.json --output=/tmp/real-preview/preview.mp4 --manifest=/tmp/real-preview/manifest.json --render --smoke
      - name: Verify rendered media/BGM bindings and frame overlap
        run: |
          test -s /tmp/real-preview/preview.mp4
          ffprobe -v error -show_entries stream=codec_type -of csv=p=0 /tmp/real-preview/preview.mp4 | grep -q '^video$'
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const m=JSON.parse(readFileSync('/tmp/real-preview/manifest.json','utf8'));
          if(m.schemaVersion!=='wedding-movie-project-real-media-preview/v1') throw new Error('schema');
          if(m.render.state!=='RENDERED'||!m.render.sha256) throw new Error('render');
          if(m.scenes.length!==2||m.scenes[0].mediaKind!=='IMAGE'||m.scenes[1].mediaKind!=='VIDEO') throw new Error('media binding');
          if(m.timeline.totalFrames!==54) throw new Error(`expected 54f after 6f overlap, got ${m.timeline.totalFrames}`);
          if(m.transitions[0].transition!=='CROSS_DISSOLVE'||m.transitions[0].durationFrames!==6) throw new Error('transition');
          if(m.summary.allRealMediaBoundCurrent!==true||m.summary.bgmCurrent!==true||m.summary.productionReady!==false) throw new Error('summary boundary');
          if(m.evidenceBoundary.remotionStudioGuiActual!=='NOT_RUN'||m.evidenceBoundary.palmierGuiActual!=='NOT_RUN'||m.evidenceBoundary.macDaVinciGuiActual!=='NOT_RUN'||m.evidenceBoundary.visualQa!=='NOT_RUN') throw new Error('actual boundary');
          NODE
      - name: Post-audit media drift fails closed
        shell: bash
        run: |
          printf 'tamper' >> /tmp/real-preview/scene-a.jpg
          if node --no-warnings motion-studio/scripts/render-wedding-project-real-media-preview.mts --selected-manifest=/tmp/real-preview/selected.json --readiness-audit=/tmp/real-preview/audit.json --manifest=/tmp/real-preview/stale.json 2>/tmp/real-preview/stale.err; then
            echo 'expected media SHA drift to fail closed' >&2
            exit 1
          fi
          grep -q 'REAL_MEDIA_PREVIEW_MEDIA_SHA_MISMATCH' /tmp/real-preview/stale.err
