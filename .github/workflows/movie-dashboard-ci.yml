name: Movie Dashboard CI

on:
  pull_request:
    paths:
      - "movie-dashboard/**"
      - ".github/workflows/movie-dashboard-ci.yml"
  push:
    paths:
      - "movie-dashboard/**"
      - ".github/workflows/movie-dashboard-ci.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: movie-dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: movie-dashboard/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: AI video safety contracts
        run: pnpm check:video-contracts

      - name: AI video failure-learning contracts
        run: pnpm check:video-failure-learning

      - name: TypeScript and Vite build
        run: pnpm build
