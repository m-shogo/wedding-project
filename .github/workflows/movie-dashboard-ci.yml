name: Movie Dashboard CI

on:
  pull_request:
    paths:
      - "movie-dashboard/**"
      - "motion-studio/src/data/openingV1Media.ts"
      - "motion-studio/src/data/photoLibrary.generated.ts"
      - "motion-studio/src/data/assets.ts"
      - ".github/workflows/movie-dashboard-ci.yml"
  push:
    paths:
      - "movie-dashboard/**"
      - "motion-studio/src/data/openingV1Media.ts"
      - "motion-studio/src/data/photoLibrary.generated.ts"
      - "motion-studio/src/data/assets.ts"
      - ".github/workflows/movie-dashboard-ci.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: movie-dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: movie-dashboard/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: AI video safety contracts
        run: pnpm check:video-contracts

      - name: AI video failure-learning contracts
        run: pnpm check:video-failure-learning

      - name: AI video prompt quality contracts
        run: pnpm check:video-prompt-quality

      - name: Movie Coach registry contracts
        run: pnpm check:movie-coach

      - name: Typography DaVinci Actual run plan contracts
        run: node scripts/verify-typography-davinci-actual-run-plan-contracts.mjs

      - name: Typography DaVinci Actual session contracts
        run: node scripts/verify-typography-davinci-actual-session-contracts.mjs

      - name: Baseline Hop DaVinci contracts
        run: node scripts/verify-baseline-hop-davinci-contracts.mjs

      - name: Triplet DaVinci contracts
        run: node scripts/verify-triplet-davinci-contracts.mjs

      - name: Typography DaVinci Actual workflow registry
        run: node scripts/verify-typography-davinci-actual-workflow-registry.mjs

      - name: TypeScript and Vite build
        run: pnpm build
