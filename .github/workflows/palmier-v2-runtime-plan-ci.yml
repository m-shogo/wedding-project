name: Palmier v2 Resolve Runtime Plan CI

on:
  pull_request:
    paths:
      - "motion-studio/src/data/resolvePalmierFCPXMLV2Runtime.ts"
      - "motion-studio/scripts/resolve-palmier-fcpxml-v2-runtime-plan.mts"
      - "motion-studio/scripts/validate-palmier-fcpxml-v2-resolve-evidence.mts"
      - "motion-studio/scripts/prepare-palmier-fcpxml-v2-resolve-session.mts"
      - "motion-studio/scripts/check-palmier-fcpxml-v2-runtime-plan.mts"
      - "docs/prompts/2026-08-26-resolve21-palmier-fcpxml-v2-actual-agent.md"
      - "docs/research/2026-08-26-movie-tool-learning-run-36-palmier-v2-runtime-plan.md"
      - ".github/workflows/palmier-v2-runtime-plan-ci.yml"
  push:
    paths:
      - "motion-studio/src/data/resolvePalmierFCPXMLV2Runtime.ts"
      - "motion-studio/scripts/resolve-palmier-fcpxml-v2-runtime-plan.mts"
      - "motion-studio/scripts/validate-palmier-fcpxml-v2-resolve-evidence.mts"
      - "motion-studio/scripts/prepare-palmier-fcpxml-v2-resolve-session.mts"
      - "motion-studio/scripts/check-palmier-fcpxml-v2-runtime-plan.mts"
      - "docs/prompts/2026-08-26-resolve21-palmier-fcpxml-v2-actual-agent.md"
      - "docs/research/2026-08-26-movie-tool-learning-run-36-palmier-v2-runtime-plan.md"
      - ".github/workflows/palmier-v2-runtime-plan-ci.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: motion-studio/pnpm-lock.yaml

      - name: Install motion-studio dependencies
        working-directory: motion-studio
        run: pnpm install --frozen-lockfile

      - name: TypeScript
        working-directory: motion-studio
        run: pnpm typecheck

      - name: Effective Palmier v2 runtime contract
        working-directory: motion-studio
        run: node --no-warnings scripts/check-palmier-fcpxml-v2-runtime-plan.mts

      - name: Compile effective v2 human plan
        working-directory: motion-studio
        run: |
          node --no-warnings scripts/resolve-palmier-fcpxml-v2-runtime-plan.mts > /tmp/palmier-v2-plan.txt
          grep -Fq 'Effective definition: PALMIER_SCENE_V2_RUNTIME_OVERLAY' /tmp/palmier-v2-plan.txt
          grep -Fq 'independent-text-scale-readback' /tmp/palmier-v2-plan.txt
          grep -Fq 'title-box-omission-readback' /tmp/palmier-v2-plan.txt
          grep -Fq 'nested-timeline-readback' /tmp/palmier-v2-plan.txt
          grep -Fq 'visual-checkpoint-render' /tmp/palmier-v2-plan.txt
          grep -Fq 'Render required: YES' /tmp/palmier-v2-plan.txt
          grep -Fq 'Minimum independent executions: 2' /tmp/palmier-v2-plan.txt
          grep -Fq 'prepare-palmier-fcpxml-v2-resolve-session.mts' /tmp/palmier-v2-plan.txt

      - name: Fresh v2 evidence stays fail closed
        working-directory: motion-studio
        run: |
          node --no-warnings scripts/resolve-palmier-fcpxml-v2-runtime-plan.mts --evidence-template > /tmp/palmier-v2-evidence.json
          node --no-warnings scripts/validate-palmier-fcpxml-v2-resolve-evidence.mts /tmp/palmier-v2-evidence.json
          grep -Fq '"result": "NOT_RUN"' /tmp/palmier-v2-evidence.json
          grep -Fq '"promotionEligible": false' /tmp/palmier-v2-evidence.json

      - name: Promotion refuses missing render
        working-directory: motion-studio
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = '/tmp/palmier-v2-evidence.json';
          const e = JSON.parse(fs.readFileSync(p, 'utf8'));
          e.capturedAt = new Date().toISOString();
          e.result = 'PASS';
          e.promotionEligible = true;
          for (const step of e.stepResults) step.status = 'PASS';
          for (const input of e.inputInventory) {
            input.present = true;
            input.pathOrRef = `ci://${input.id}`;
            input.sha256 = '1'.repeat(64);
          }
          e.humanReview.completed = true;
          e.humanReview.notes = ['CI semantic promotion fixture only; not runtime evidence.'];
          fs.writeFileSync('/tmp/promo-no-render.json', JSON.stringify(e, null, 2));
          NODE
          if node --no-warnings scripts/validate-palmier-fcpxml-v2-resolve-evidence.mts /tmp/promo-no-render.json > /tmp/no-render.txt 2>&1; then
            echo 'Promotion unexpectedly passed without render artifact'
            exit 1
          fi
          grep -Fq 'requires a RENDER artifact' /tmp/no-render.txt

      - name: Promotion refuses unhashed render then accepts hashed semantic fixture
        working-directory: motion-studio
        run: |
          node <<'NODE'
          const fs = require('fs');
          const e = JSON.parse(fs.readFileSync('/tmp/promo-no-render.json', 'utf8'));
          e.artifacts.push({kind:'RENDER', path:'ci://neutral-checkpoint.mov', sha256:null});
          fs.writeFileSync('/tmp/promo-unhashed-render.json', JSON.stringify(e, null, 2));
          NODE
          if node --no-warnings scripts/validate-palmier-fcpxml-v2-resolve-evidence.mts /tmp/promo-unhashed-render.json > /tmp/unhashed.txt 2>&1; then
            echo 'Promotion unexpectedly passed with unhashed render artifact'
            exit 1
          fi
          grep -Fq 'requires SHA-256' /tmp/unhashed.txt

          node <<'NODE'
          const fs = require('fs');
          const e = JSON.parse(fs.readFileSync('/tmp/promo-unhashed-render.json', 'utf8'));
          e.artifacts[0].sha256 = '2'.repeat(64);
          fs.writeFileSync('/tmp/promo-hashed-render.json', JSON.stringify(e, null, 2));
          NODE
          node --no-warnings scripts/validate-palmier-fcpxml-v2-resolve-evidence.mts /tmp/promo-hashed-render.json

      - name: v2 session builder stays blocked without real Palmier attachment
        working-directory: motion-studio
        run: |
          node --no-warnings scripts/prepare-resolve-canary-inputs.mts palmier
          execution='DV21-PALMIER-FCPXML-01-CI-V2-MUST-BLOCK'
          if node --no-warnings scripts/prepare-palmier-fcpxml-v2-resolve-session.mts --execution-id "$execution" > /tmp/v2-session-blocked.txt 2>&1; then
            echo 'Palmier v2 session unexpectedly became READY without a real attachment'
            exit 1
          fi
          grep -Fq 'Palmier --reuse-existing requires a PREPARED manifest' /tmp/v2-session-blocked.txt
          test ! -e "out/canary-sessions/$execution"

      - name: Runtime honesty markers
        run: |
          grep -Fq 'ONE_PASS != REPRODUCED' docs/research/2026-08-26-movie-tool-learning-run-36-palmier-v2-runtime-plan.md
          grep -Fq 'REAL_PALMIER_PROVENANCE != RESOLVE_IMPORT_VERIFIED' docs/prompts/2026-08-26-resolve21-palmier-fcpxml-v2-actual-agent.md
