name: Profile V1 Final Handoff CI

on:
  pull_request:
    paths:
      - "motion-studio/scripts/profile-v1-final-render-review.mts"
      - "motion-studio/scripts/export-profile-v1-production-bundle.mts"
      - "motion-studio/scripts/profile-v1-davinci-finishing-evidence.mts"
      - "motion-studio/scripts/profile-v1-final-delivery-approval.mts"
      - "motion-studio/scripts/profile-v1-production-status.mts"
      - "motion-studio/scripts/check-profile-v1-final-handoff-contracts.mts"
      - ".github/workflows/profile-v1-final-handoff-ci.yml"
  push:
    branches: [main]
    paths:
      - "motion-studio/scripts/profile-v1-final-render-review.mts"
      - "motion-studio/scripts/export-profile-v1-production-bundle.mts"
      - "motion-studio/scripts/profile-v1-davinci-finishing-evidence.mts"
      - "motion-studio/scripts/profile-v1-final-delivery-approval.mts"
      - "motion-studio/scripts/profile-v1-production-status.mts"
      - "motion-studio/scripts/check-profile-v1-final-handoff-contracts.mts"
      - ".github/workflows/profile-v1-final-handoff-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: motion-studio
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: motion-studio/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Final handoff static contracts
        run: node --no-warnings scripts/check-profile-v1-final-handoff-contracts.mts
      - name: Fresh clone final Human review cannot initialize
        run: |
          if node --no-warnings scripts/profile-v1-final-render-review.mts --init; then
            echo "Profile final review unexpectedly initialized without approved upstream/final render"
            exit 1
          fi
      - name: Fresh clone production bundle cannot export
        run: |
          if node --no-warnings scripts/export-profile-v1-production-bundle.mts; then
            echo "Profile production bundle unexpectedly exported without final Human review"
            exit 1
          fi
      - name: Fresh clone cannot manufacture Mac DaVinci Actual
        run: |
          if node --no-warnings scripts/profile-v1-davinci-finishing-evidence.mts --init; then
            echo "Profile DaVinci evidence unexpectedly initialized without a current production bundle"
            exit 1
          fi
          if node --no-warnings scripts/profile-v1-davinci-finishing-evidence.mts --strict; then
            echo "Profile DaVinci evidence unexpectedly passed without real Mac GUI Actual"
            exit 1
          fi
      - name: Fresh clone cannot manufacture final delivery approval
        run: |
          if node --no-warnings scripts/profile-v1-final-delivery-approval.mts --init; then
            echo "Profile final approval unexpectedly initialized without verified DaVinci Actual"
            exit 1
          fi
          if node --no-warnings scripts/profile-v1-final-delivery-approval.mts --strict; then
            echo "Profile final approval unexpectedly passed without explicit Human approval"
            exit 1
          fi
      - name: Production status identifies first blocker and keeps downstream NOT_RUN
        run: |
          mkdir -p out/qa
          node --no-warnings scripts/profile-v1-production-status.mts --json > out/qa/profile-v1-production-status.json
          node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync('out/qa/profile-v1-production-status.json','utf8')); if(r.schemaVersion!=='profile-v1-production-status/v1')process.exit(1); if(r.overallState!=='ASSEMBLY_REQUIRED')process.exit(1); for(const key of ['finalRender','finalRenderReview','productionBundle','davinciFinishing','finalDeliveryApproval']){if(r.stages[key].state!=='NOT_RUN')process.exit(1)} if(r.readiness.macDaVinciActual!=='NOT_RUN'||r.readiness.finalDeliveryApproved!==false||r.readiness.productionReady!==false)process.exit(1);"
          if node --no-warnings scripts/profile-v1-production-status.mts --strict; then
            echo "Profile production status unexpectedly reached PRODUCTION_READY in CI"
            exit 1
          fi
