name: Wedding Projection Delivery Currentness CI

on:
  pull_request:
    paths:
      - 'motion-studio/scripts/wedding-projection-delivery-manifest-currentness.mts'
      - 'motion-studio/scripts/check-wedding-projection-delivery-manifest-currentness.mts'
      - '.github/workflows/wedding-projection-delivery-currentness-ci.yml'
  push:
    branches: [main]
    paths:
      - 'motion-studio/scripts/wedding-projection-delivery-manifest-currentness.mts'
      - 'motion-studio/scripts/check-wedding-projection-delivery-manifest-currentness.mts'
      - '.github/workflows/wedding-projection-delivery-currentness-ci.yml'

permissions:
  contents: read

jobs:
  currentness-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify projection delivery strict-current fail-closed contract
        working-directory: motion-studio
        run: node --no-warnings scripts/check-wedding-projection-delivery-manifest-currentness.mts
