name: Opening V1 Audio Status Handoff CI

on:
  pull_request:
    paths:
      - 'motion-studio/scripts/opening-v1-audio-listening-review.mts'
      - 'motion-studio/scripts/init-opening-v1-final-render-review.mts'
      - 'movie-dashboard/scripts/sync-opening-audio-listening-status.mjs'
      - 'movie-dashboard/scripts/verify-opening-audio-listening-handoff.mjs'
      - 'movie-dashboard/src/data/openingAudioListeningStatus.generated.ts'
      - 'movie-dashboard/src/data/openingProductionStatusHandoff.ts'
      - '.github/workflows/opening-v1-audio-status-handoff-ci.yml'
  workflow_dispatch:

jobs:
  audio-status-handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify generated Human audio status is current
        working-directory: movie-dashboard
        run: node scripts/sync-opening-audio-listening-status.mjs
      - name: Verify Motion Zukan audio handoff guardrails
        working-directory: movie-dashboard
        run: node scripts/verify-opening-audio-listening-handoff.mjs
