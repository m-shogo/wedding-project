name: Wedding Real Media Visual Correction Navigation Dashboard CI

on:
  pull_request:
    paths:
      - 'movie-dashboard/src/data/motionZukanSceneFocus.ts'
      - 'movie-dashboard/src/components/WeddingRealMediaVisualReviewOperatorCard.tsx'
      - 'movie-dashboard/src/components/WeddingRealMediaFramingOperatorCard.tsx'
      - 'movie-dashboard/src/components/OpeningCropReviewOperatorCard.tsx'
      - 'movie-dashboard/src/components/ProfileRealMediaReviewOperatorCard.tsx'
      - 'movie-dashboard/src/components/RhythmSceneTimingCorrectionCard.tsx'
      - 'movie-dashboard/src/components/RhythmSceneTransitionCorrectionCard.tsx'
      - 'motion-studio/scripts/wedding-project-real-media-preview-visual-review.mts'
      - 'movie-dashboard/scripts/verify-real-media-visual-correction-navigation-contracts.mjs'
      - '.github/workflows/wedding-real-media-visual-correction-navigation-dashboard-ci.yml'
  workflow_dispatch:

jobs:
  visual-correction-navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Guard revision-bound visual correction navigation
        run: node movie-dashboard/scripts/verify-real-media-visual-correction-navigation-contracts.mjs
      - name: Build Movie Dashboard
        working-directory: movie-dashboard
        run: |
          pnpm install --frozen-lockfile
          pnpm build
