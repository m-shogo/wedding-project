name: Motion Studio CI

on:
  pull_request:
    paths:
      - "motion-studio/**"
      - ".github/workflows/motion-studio-ci.yml"
  push:
    paths:
      - "motion-studio/**"
      - ".github/workflows/motion-studio-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: motion-studio
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: motion-studio/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install ffmpeg for render QA
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Opening V1 media discovery
        run: pnpm prepare:opening-v1

      - name: TypeScript
        run: pnpm typecheck

      - name: Motion / asset / part / preset contracts
        run: pnpm check

      - name: Opening V1 sound contracts
        run: pnpm check:opening-sound

      - name: Opening V1 assembly preflight report stays honest on fresh clone
        run: |
          mkdir -p out/qa
          pnpm opening:assembly-preflight -- --json > out/qa/opening-v1-assembly-preflight.json
          node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync('out/qa/opening-v1-assembly-preflight.json','utf8')); if(r.schemaVersion!=='opening-v1-assembly-preflight/v1') process.exit(1); if(r.photos.expectedCount!==11) process.exit(1); if(r.readiness.finalRenderEligible!==false) process.exit(1); if(r.readiness.renderQaState!=='NOT_RUN') process.exit(1); if(r.readiness.macDaVinciActualState!=='NOT_RUN') process.exit(1);"
          if pnpm opening:assembly-preflight:strict; then
            echo "assembly preflight unexpectedly passed without real photos/BGM"
            exit 1
          fi
          if pnpm opening:assembly-preflight:mix-strict; then
            echo "mix-strict preflight unexpectedly passed without ambience"
            exit 1
          fi
          echo "assembly preflight correctly reports JSON and fails closed on missing real media"

      - name: Opening V1 final BGM gate fails closed without cleared media
        run: |
          if pnpm check:opening-sound:strict; then
            echo "final BGM gate unexpectedly passed on a fresh clone"
            exit 1
          fi
          echo "final BGM gate correctly blocks missing/unapproved BGM"

      - name: Opening V1 composition contract
        run: pnpm exec remotion compositions src/index-opening-v1.ts

      - name: StaRt Motion Kit composition contract
        run: pnpm exec remotion compositions src/index-start-motion-kit.ts

      - name: Opening V1 final-render QA contract
        run: |
          mkdir -p out/qa
          ffmpeg -hide_banner -loglevel error \
            -f lavfi -i "color=c=gray:s=640x360:r=30:d=1" \
            -c:v libx264 -pix_fmt yuv420p -y out/qa/render-contract.mp4
          node --no-warnings scripts/check-opening-render.mts \
            out/qa/render-contract.mp4 \
            --width=640 --height=360 --fps=30 --duration=1 --duration-tolerance=0.05

      - name: Opening V1 visual smoke stills
        run: node --no-warnings scripts/render-opening-v1-qa-stills.mts

      - name: Upload Opening V1 visual QA
        uses: actions/upload-artifact@v4
        with:
          name: opening-v1-qa-stills
          path: motion-studio/out/qa/opening-v1/*.png
          if-no-files-found: error
          retention-days: 7
