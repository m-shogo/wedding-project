name: Profile V1 Production Command Surface CI

on:
  pull_request:
    paths:
      - "motion-studio/package.json"
      - "motion-studio/scripts/check-profile-v1-production-command-surface.mts"
      - "motion-studio/scripts/profile-v1-*.mts"
      - "motion-studio/scripts/render-profile-v1-*.mts"
      - "motion-studio/scripts/check-profile-*.mts"
      - "motion-studio/scripts/export-profile-v1-production-bundle.mts"
      - ".github/workflows/profile-v1-production-command-surface-ci.yml"
  push:
    branches: [main]
    paths:
      - "motion-studio/package.json"
      - "motion-studio/scripts/check-profile-v1-production-command-surface.mts"
      - "motion-studio/scripts/profile-v1-*.mts"
      - "motion-studio/scripts/render-profile-v1-*.mts"
      - "motion-studio/scripts/check-profile-*.mts"
      - "motion-studio/scripts/export-profile-v1-production-bundle.mts"
      - ".github/workflows/profile-v1-production-command-surface-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: motion-studio
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: motion-studio/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript
        run: pnpm typecheck

      - name: Verify command mapping and guardrail surface
        run: node --no-warnings scripts/check-profile-v1-production-command-surface.mts

      - name: Prepare command refreshes runtime media and remains fail-closed
        run: |
          pnpm prepare:profile-v1
          pnpm profile:media:check
          pnpm profile:production-status
          if pnpm profile:assembly-preflight:strict; then
            echo "Profile assembly unexpectedly passed on a fresh clone"
            exit 1
          fi
          if pnpm render:profile-v1; then
            echo "Profile production render unexpectedly bypassed missing media/Human QA gates"
            exit 1
          fi
          echo "Profile command surface is operational and production render remains blocked until real inputs/Human evidence exist"
