name: Wedding Project Remotion Production Prep CI

on:
  pull_request:
    paths:
      - 'motion-studio/scripts/prepare-wedding-project-remotion-production-handoff.mts'
      - 'motion-studio/scripts/export-wedding-remotion-element-handoff-identities.mts'
      - 'motion-studio/scripts/check-wedding-remotion-element-handoff-identities.mts'
      - 'motion-studio/scripts/verify-wedding-project-remotion-element-identities.mts'
      - 'motion-studio/scripts/check-wedding-project-remotion-element-identity-receipt.mts'
      - 'motion-studio/scripts/export-wedding-production-handoff.mts'
      - 'motion-studio/scripts/verify-wedding-production-handoff-provenance.mts'
      - 'motion-studio/src/motion-kit/engines.tsx'
      - 'movie-dashboard/src/data/remotionElementCandidates.ts'
      - '.github/workflows/wedding-project-remotion-production-prep-ci.yml'
  push:
    branches: [main]
    paths:
      - 'motion-studio/scripts/prepare-wedding-project-remotion-production-handoff.mts'
      - 'motion-studio/scripts/export-wedding-remotion-element-handoff-identities.mts'
      - 'motion-studio/scripts/check-wedding-remotion-element-handoff-identities.mts'
      - 'motion-studio/scripts/verify-wedding-project-remotion-element-identities.mts'
      - 'motion-studio/scripts/check-wedding-project-remotion-element-identity-receipt.mts'
      - 'motion-studio/scripts/export-wedding-production-handoff.mts'
      - 'motion-studio/scripts/verify-wedding-production-handoff-provenance.mts'
      - 'motion-studio/src/motion-kit/engines.tsx'
      - 'movie-dashboard/src/data/remotionElementCandidates.ts'
      - '.github/workflows/wedding-project-remotion-production-prep-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Missing batch fails closed before any production prep
        working-directory: motion-studio
        run: |
          if node --no-warnings scripts/prepare-wedding-project-remotion-production-handoff.mts \
            --movie=opening \
            --phase=identity \
            --batch=/tmp/definitely-missing-opening-batch.json > /tmp/missing-batch.log 2>&1; then
            echo 'Missing batch must block production prep.'
            exit 1
          fi
          grep -q 'TYPOGRAPHY_PROJECT_BATCH_MISSING_BEFORE_PRODUCTION_PREP' /tmp/missing-batch.log

      - name: Build a handoff-ready Opening Typography batch fixture
        run: |
          mkdir -p movie-dashboard/out/typography-project-delivery
          cat > movie-dashboard/out/typography-project-delivery/opening-typography-production-batch.json <<'JSON'
          {
            "schemaVersion": "wedding-movie-typography-project-delivery/v1",
            "authority": "DERIVED_PROJECT_HANDOFF",
            "projectId": "opening",
            "scenes": [{"sceneId":"opening-title","sourceRevision":"rev-prep-001"}],
            "remotionElementIdentityVerification": {
              "state": "NOT_RUN",
              "currentnessVerifiedByBatchBuild": false,
              "selectedPatternIds": ["type-mask-reveal"],
              "sceneBindings": [{
                "sceneId": "opening-title",
                "sourceRevision": "rev-prep-001",
                "patternId": "type-mask-reveal",
                "adoptedForMovie": false,
                "canonicalEngine": "TypographyRevealEngine",
                "canonicalMode": "mask",
                "canonicalSource": "motion-studio/src/motion-kit/engines.tsx#TypographyRevealEngine"
              }]
            },
            "summary": {
              "batchReadyForPalmierDaVinciHandoff": true,
              "productionReady": false
            }
          }
          JSON

      - name: One command prepares and rechecks the SHA-bound identity receipt
        working-directory: motion-studio
        run: |
          node --no-warnings scripts/prepare-wedding-project-remotion-production-handoff.mts \
            --movie=opening \
            --phase=identity \
            --json > /tmp/remotion-production-prep.json
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('/tmp/remotion-production-prep.json', 'utf8'));
          if (report.schemaVersion !== 'wedding-project-remotion-production-prep/v1') throw new Error('prep schema mismatch');
          if (report.state !== 'CURRENT' || report.phase !== 'identity') throw new Error('identity prep must be CURRENT');
          if (report.steps.length !== 4 || report.steps.some((step) => step.state !== 'PASS')) throw new Error('all identity prep steps must pass');
          if (report.next.kind !== 'STAGE_ROLE_MANIFEST_AND_RUN_HANDOFF_PHASE') throw new Error('identity prep next action mismatch');
          if (report.evidenceBoundary.macRemotionStudioGuiActual !== 'NOT_RUN_UNLESS_HUMAN_EXECUTED') throw new Error('Studio Actual boundary changed');
          if (report.evidenceBoundary.macDavinciResolveGuiActual !== 'NOT_RUN_UNLESS_HUMAN_EXECUTED') throw new Error('DaVinci Actual boundary changed');
          if (report.evidenceBoundary.productionReadyPromotedByThisPrep !== false) throw new Error('prep must not promote productionReady');
          const receipt = JSON.parse(fs.readFileSync('../movie-dashboard/out/remotion-element-handoff/opening-project-remotion-identity-verification-receipt.json', 'utf8'));
          if (receipt.state !== 'CURRENT') throw new Error('identity receipt must be CURRENT');
          if (receipt.macRemotionStudioGuiActualPerformedByThisVerification !== false) throw new Error('receipt must not promote Studio Actual');
          if (receipt.macDaVinciGuiActualPerformedByThisVerification !== false) throw new Error('receipt must not promote DaVinci Actual');
          NODE

      - name: Handoff phase requires the canonical Human-selected Role manifest
        working-directory: motion-studio
        run: |
          if node --no-warnings scripts/prepare-wedding-project-remotion-production-handoff.mts \
            --movie=opening \
            --phase=handoff > /tmp/missing-role.log 2>&1; then
            echo 'Handoff phase must block without the canonical Project Role manifest.'
            exit 1
          fi
          grep -q 'PROJECT_ROLE_HANDOFF_MANIFEST_MISSING_BEFORE_CANONICAL_HANDOFF' /tmp/missing-role.log
          grep -q 'productionReadyPromotedByThisPrep=NO' /tmp/remotion-production-prep.json || true

      - name: Production prep must never synthesize GUI Actual PASS
        run: |
          ! grep -q "macRemotionStudioGuiActual: 'PASS'" motion-studio/scripts/prepare-wedding-project-remotion-production-handoff.mts
          ! grep -q "macDavinciResolveGuiActual: 'PASS'" motion-studio/scripts/prepare-wedding-project-remotion-production-handoff.mts
          ! grep -q 'productionReadyPromotedByThisPrep: true' motion-studio/scripts/prepare-wedding-project-remotion-production-handoff.mts
