name: Wedding Project Remotion Production Prep CI

on:
  pull_request:
    paths:
      - 'motion-studio/scripts/prepare-wedding-project-remotion-production-handoff.mts'
      - 'motion-studio/scripts/export-wedding-remotion-element-handoff-identities.mts'
      - 'motion-studio/scripts/check-wedding-remotion-element-handoff-identities.mts'
      - 'motion-studio/scripts/verify-wedding-project-remotion-element-identities.mts'
      - 'motion-studio/scripts/check-wedding-project-remotion-element-identity-receipt.mts'
      - 'motion-studio/scripts/verify-wedding-project-remotion-identity-handoff.mts'
      - 'motion-studio/scripts/check-wedding-palmier-typography-timeline-export-receipt.mts'
      - 'motion-studio/scripts/build-wedding-palmier-typography-assembly-plan.mts'
      - 'motion-studio/scripts/verify-wedding-palmier-typography-timeline-export.mts'
      - 'motion-studio/scripts/export-wedding-production-handoff.mts'
      - 'motion-studio/scripts/verify-wedding-production-handoff-provenance.mts'
      - 'motion-studio/src/motion-kit/engines.tsx'
      - 'movie-dashboard/src/data/remotionElementCandidates.ts'
      - 'movie-dashboard/src/data/typographyProjectDeliveryBatch.ts'
      - '.github/workflows/wedding-project-remotion-production-prep-ci.yml'
  push:
    branches: [main]
    paths:
      - 'motion-studio/scripts/prepare-wedding-project-remotion-production-handoff.mts'
      - 'motion-studio/scripts/export-wedding-remotion-element-handoff-identities.mts'
      - 'motion-studio/scripts/check-wedding-remotion-element-handoff-identities.mts'
      - 'motion-studio/scripts/verify-wedding-project-remotion-element-identities.mts'
      - 'motion-studio/scripts/check-wedding-project-remotion-element-identity-receipt.mts'
      - 'motion-studio/scripts/verify-wedding-project-remotion-identity-handoff.mts'
      - 'motion-studio/scripts/check-wedding-palmier-typography-timeline-export-receipt.mts'
      - 'motion-studio/scripts/build-wedding-palmier-typography-assembly-plan.mts'
      - 'motion-studio/scripts/verify-wedding-palmier-typography-timeline-export.mts'
      - 'motion-studio/scripts/export-wedding-production-handoff.mts'
      - 'motion-studio/scripts/verify-wedding-production-handoff-provenance.mts'
      - 'motion-studio/src/motion-kit/engines.tsx'
      - 'movie-dashboard/src/data/remotionElementCandidates.ts'
      - 'movie-dashboard/src/data/typographyProjectDeliveryBatch.ts'
      - '.github/workflows/wedding-project-remotion-production-prep-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Missing batch fails closed before any production prep
        working-directory: motion-studio
        run: |
          if node --no-warnings scripts/prepare-wedding-project-remotion-production-handoff.mts \
            --movie=opening \
            --phase=identity \
            --batch=/tmp/definitely-missing-opening-batch.json > /tmp/missing-batch.log 2>&1; then
            echo 'Missing batch must block production prep.'
            exit 1
          fi
          grep -q 'TYPOGRAPHY_PROJECT_BATCH_MISSING_BEFORE_PRODUCTION_PREP' /tmp/missing-batch.log

      - name: Build a handoff-ready Opening Typography batch fixture
        run: |
          mkdir -p movie-dashboard/out/typography-project-delivery
          cat > movie-dashboard/out/typography-project-delivery/opening-typography-production-batch.json <<'JSON'
          {
            "schemaVersion": "wedding-movie-typography-project-delivery/v1",
            "authority": "DERIVED_PROJECT_HANDOFF",
            "projectId": "opening",
            "scenes": [{"sceneId":"opening-title","sourceRevision":"rev-prep-001"}],
            "remotionElementIdentityVerification": {
              "state": "NOT_RUN",
              "currentnessVerifiedByBatchBuild": false,
              "selectedPatternIds": ["type-mask-reveal"],
              "sceneBindings": [{
                "sceneId": "opening-title",
                "sourceRevision": "rev-prep-001",
                "patternId": "type-mask-reveal",
                "adoptedForMovie": false,
                "canonicalEngine": "TypographyRevealEngine",
                "canonicalMode": "mask",
                "canonicalSource": "motion-studio/src/motion-kit/engines.tsx#TypographyRevealEngine"
              }]
            },
            "summary": {
              "batchReadyForPalmierDaVinciHandoff": true,
              "productionReady": false
            }
          }
          JSON

      - name: One command prepares and rechecks the SHA-bound identity receipt
        working-directory: motion-studio
        run: |
          node --no-warnings scripts/prepare-wedding-project-remotion-production-handoff.mts \
            --movie=opening \
            --phase=identity \
            --json > /tmp/remotion-production-prep.json
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('/tmp/remotion-production-prep.json', 'utf8'));
          if (report.schemaVersion !== 'wedding-project-remotion-production-prep/v3') throw new Error('prep schema mismatch');
          if (report.authority !== 'DERIVED_PROJECT_REMOTION_PRODUCTION_PREP_WITH_PALMIER_TIMELINE_GATE') throw new Error('prep authority mismatch');
          if (report.state !== 'CURRENT' || report.phase !== 'identity') throw new Error('identity prep must be CURRENT');
          if (report.batchInput.source !== 'CANONICAL_PATH') throw new Error('canonical prep source mismatch');
          if (report.canonicalStage.state !== 'NOT_RUN' || report.canonicalStage.performedByThisRun !== false) throw new Error('identity prep must not claim staging');
          if (report.palmierTimelineExport.receiptState !== 'NOT_RUN' || report.palmierTimelineExport.checkedByThisRun !== false) throw new Error('identity prep must not claim Palmier receipt verification');
          if (report.steps.length !== 4 || report.steps.some((step) => step.state !== 'PASS')) throw new Error('all identity prep steps must pass');
          if (report.next.kind !== 'STAGE_CANONICAL_INPUTS') throw new Error('identity prep next action mismatch');
          if (report.evidenceBoundary.palmierGuiActual !== 'NOT_RUN_UNLESS_HUMAN_EXECUTED') throw new Error('Palmier Actual boundary changed');
          if (report.evidenceBoundary.macRemotionStudioGuiActual !== 'NOT_RUN_UNLESS_HUMAN_EXECUTED') throw new Error('Studio Actual boundary changed');
          if (report.evidenceBoundary.macDavinciResolveGuiActual !== 'NOT_RUN_UNLESS_HUMAN_EXECUTED') throw new Error('DaVinci Actual boundary changed');
          if (report.evidenceBoundary.productionReadyPromotedByThisPrep !== false) throw new Error('prep must not promote productionReady');
          const receipt = JSON.parse(fs.readFileSync('../movie-dashboard/out/remotion-element-handoff/opening-project-remotion-identity-verification-receipt.json', 'utf8'));
          if (receipt.state !== 'CURRENT') throw new Error('identity receipt must be CURRENT');
          if (receipt.macRemotionStudioGuiActualPerformedByThisVerification !== false) throw new Error('receipt must not promote Studio Actual');
          if (receipt.macDaVinciGuiActualPerformedByThisVerification !== false) throw new Error('receipt must not promote DaVinci Actual');
          NODE

      - name: Download-style absolute batch path with spaces is supported for identity prep
        run: |
          mkdir -p '/tmp/Motion Zukan Download'
          cp movie-dashboard/out/typography-project-delivery/opening-typography-production-batch.json \
            '/tmp/Motion Zukan Download/opening typography production batch.json'
          cd motion-studio
          node --no-warnings scripts/prepare-wedding-project-remotion-production-handoff.mts \
            --movie=opening \
            --phase=identity \
            --batch='/tmp/Motion Zukan Download/opening typography production batch.json' \
            --json > /tmp/external-batch-prep.json
          node - <<'NODE'
          const fs = require('fs');
          const external = '/tmp/Motion Zukan Download/opening typography production batch.json';
          const report = JSON.parse(fs.readFileSync('/tmp/external-batch-prep.json', 'utf8'));
          if (report.state !== 'CURRENT') throw new Error('external-path identity prep must be CURRENT');
          if (report.batchInput.source !== 'EXPLICIT_OPERATOR_PATH') throw new Error('external-path source must be explicit');
          if (report.batchInput.absolutePath !== external) throw new Error('external absolute path drift');
          if (!report.steps.find((step) => step.id === 'GENERATE_PROJECT_IDENTITY_RECEIPT')?.command.includes("--batch='/tmp/Motion Zukan Download/opening typography production batch.json'")) throw new Error('display command must shell-quote path with spaces');
          const receipt = JSON.parse(fs.readFileSync('../movie-dashboard/out/remotion-element-handoff/opening-project-remotion-identity-verification-receipt.json', 'utf8'));
          if (receipt.sourceBatch.path !== external) throw new Error('receipt must bind the exact external batch path');
          if (receipt.state !== 'CURRENT') throw new Error('external-path receipt must be CURRENT');
          NODE

      - name: Handoff phase requires the canonical Human-selected Role manifest
        working-directory: motion-studio
        run: |
          if node --no-warnings scripts/prepare-wedding-project-remotion-production-handoff.mts \
            --movie=opening \
            --phase=handoff > /tmp/missing-role.log 2>&1; then
            echo 'Handoff phase must block without the canonical Project Role manifest.'
            exit 1
          fi
          grep -q 'PROJECT_ROLE_HANDOFF_MANIFEST_MISSING_BEFORE_CANONICAL_HANDOFF' /tmp/missing-role.log

      - name: Stage phase validates external Human inputs before canonical write
        run: |
          cat > '/tmp/Motion Zukan Download/opening production role handoff manifest.json' <<'JSON'
          {
            "schemaVersion":"wedding-movie-project-role-handoff/v1",
            "authority":"DERIVED_FROM_PROJECT_HANDOFF_AND_PERSISTED_HUMAN_ROLE_CONTEXT",
            "projectId":"opening",
            "typography":{
              "projectId":"opening",
              "scenes":[{"sceneId":"opening-title","sourceRevision":"rev-prep-001","selectedPatternId":"type-mask-reveal"}],
              "remotionElementIdentityVerification":{
                "selectedPatternIds":["type-mask-reveal"],
                "sceneBindings":[{
                  "sceneId":"opening-title",
                  "sourceRevision":"rev-prep-001",
                  "patternId":"type-mask-reveal",
                  "adoptedForMovie":false,
                  "canonicalEngine":"TypographyRevealEngine",
                  "canonicalMode":"mask",
                  "canonicalSource":"motion-studio/src/motion-kit/engines.tsx#TypographyRevealEngine"
                }]
              }
            },
            "roleHandoff":{"ready":true,"productionReady":false,"studioGuiActual":"NOT_RUN","davinciGuiActual":"NOT_RUN"}
          }
          JSON
          rm -f movie-dashboard/out/typography-project-delivery/opening-typography-production-batch.json
          rm -f movie-dashboard/out/project-role-handoff/opening-production-role-handoff-manifest.json
          rm -f movie-dashboard/out/remotion-element-handoff/opening-project-remotion-identity-verification-receipt.json
          cd motion-studio
          node --no-warnings scripts/prepare-wedding-project-remotion-production-handoff.mts \
            --movie=opening \
            --phase=stage \
            --batch='/tmp/Motion Zukan Download/opening typography production batch.json' \
            --role-manifest='/tmp/Motion Zukan Download/opening production role handoff manifest.json' \
            --json > /tmp/stage-prep.json
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');
          const report = JSON.parse(fs.readFileSync('/tmp/stage-prep.json', 'utf8'));
          if (report.state !== 'CURRENT' || report.phase !== 'stage') throw new Error('stage prep must be CURRENT');
          if (report.canonicalStage.state !== 'CURRENT' || report.canonicalStage.performedByThisRun !== true) throw new Error('canonical stage must be CURRENT');
          if (report.palmierTimelineExport.receiptState !== 'NOT_RUN' || report.palmierTimelineExport.checkedByThisRun !== false) throw new Error('stage must not claim Palmier receipt verification');
          for (const id of ['VERIFY_EXTERNAL_PROJECT_ROLE_HANDOFF','STAGE_VALIDATED_INPUTS_TO_CANONICAL_PATHS','REGENERATE_CANONICAL_PROJECT_IDENTITY_RECEIPT','CHECK_CANONICAL_PROJECT_IDENTITY_RECEIPT','VERIFY_CANONICAL_PROJECT_ROLE_HANDOFF']) {
            if (!report.steps.some((step) => step.id === id && step.state === 'PASS')) throw new Error(`missing stage proof: ${id}`);
          }
          if (report.next.kind !== 'BUILD_AND_VERIFY_REAL_PALMIER_TIMELINE_BEFORE_HANDOFF') throw new Error('stage next action must route through Palmier timeline verification');
          if (!report.next.command.includes('build-wedding-palmier-typography-assembly-plan.mts')) throw new Error('stage next command must build the Palmier Assembly Plan');
          const batchSource = '/tmp/Motion Zukan Download/opening typography production batch.json';
          const roleSource = '/tmp/Motion Zukan Download/opening production role handoff manifest.json';
          const batchCanonical = path.resolve('../movie-dashboard/out/typography-project-delivery/opening-typography-production-batch.json');
          const roleCanonical = path.resolve('../movie-dashboard/out/project-role-handoff/opening-production-role-handoff-manifest.json');
          const sha = (file) => crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
          if (sha(batchSource) !== sha(batchCanonical)) throw new Error('staged batch bytes drift');
          if (sha(roleSource) !== sha(roleCanonical)) throw new Error('staged role manifest bytes drift');
          const receipt = JSON.parse(fs.readFileSync('../movie-dashboard/out/remotion-element-handoff/opening-project-remotion-identity-verification-receipt.json', 'utf8'));
          if (receipt.sourceBatch.path !== batchCanonical) throw new Error('post-stage receipt must bind canonical batch path');
          if (receipt.state !== 'CURRENT') throw new Error('post-stage receipt must be CURRENT');
          if (report.evidenceBoundary.palmierGuiActual !== 'NOT_RUN_UNLESS_HUMAN_EXECUTED') throw new Error('stage must not promote Palmier Actual');
          if (report.evidenceBoundary.macRemotionStudioGuiActual !== 'NOT_RUN_UNLESS_HUMAN_EXECUTED') throw new Error('stage must not promote Studio Actual');
          if (report.evidenceBoundary.macDavinciResolveGuiActual !== 'NOT_RUN_UNLESS_HUMAN_EXECUTED') throw new Error('stage must not promote DaVinci Actual');
          NODE

      - name: Canonical handoff fails closed before production export when Palmier FCPXML receipt is missing
        working-directory: motion-studio
        run: |
          rm -f out/handoff/wedding/opening-palmier-typography-timeline-export-receipt.json
          if node --no-warnings scripts/prepare-wedding-project-remotion-production-handoff.mts \
            --movie=opening \
            --phase=handoff > /tmp/missing-palmier-receipt.log 2>&1; then
            echo 'Canonical handoff must block without CURRENT Palmier FCPXML receipt.'
            exit 1
          fi
          grep -q 'STEP_FAILED:CHECK_CURRENT_PALMIER_TIMELINE_EXPORT_RECEIPT' /tmp/missing-palmier-receipt.log
          grep -q 'palmierTimelineExportReceipt=MISSING' /tmp/missing-palmier-receipt.log
          ! test -e out/handoff/opening-v1/opening-v1-davinci-production-recovery.json

      - name: Stage phase rejects a mismatched Human role manifest before canonical write
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('/tmp/Motion Zukan Download/opening production role handoff manifest.json')
          data = json.loads(p.read_text())
          data['typography']['scenes'][0]['selectedPatternId'] = 'type-pop'
          data['typography']['remotionElementIdentityVerification']['sceneBindings'][0]['patternId'] = 'type-pop'
          p.write_text(json.dumps(data, indent=2) + '\n')
          PY
          BEFORE_BATCH=$(sha256sum movie-dashboard/out/typography-project-delivery/opening-typography-production-batch.json | awk '{print $1}')
          BEFORE_ROLE=$(sha256sum movie-dashboard/out/project-role-handoff/opening-production-role-handoff-manifest.json | awk '{print $1}')
          cd motion-studio
          if node --no-warnings scripts/prepare-wedding-project-remotion-production-handoff.mts \
            --movie=opening \
            --phase=stage \
            --batch='/tmp/Motion Zukan Download/opening typography production batch.json' \
            --role-manifest='/tmp/Motion Zukan Download/opening production role handoff manifest.json' > /tmp/stage-mismatch.log 2>&1; then
            echo 'Mismatched Human role manifest must block before canonical staging.'
            exit 1
          fi
          grep -Eq 'STEP_FAILED:VERIFY_EXTERNAL_PROJECT_ROLE_HANDOFF|PROJECT_ROLE_HANDOFF_.*MISMATCH|PROJECT_ROLE_HANDOFF_BINDINGS_DO_NOT_MATCH_RECEIPT' /tmp/stage-mismatch.log
          cd ..
          AFTER_BATCH=$(sha256sum movie-dashboard/out/typography-project-delivery/opening-typography-production-batch.json | awk '{print $1}')
          AFTER_ROLE=$(sha256sum movie-dashboard/out/project-role-handoff/opening-production-role-handoff-manifest.json | awk '{print $1}')
          test "$BEFORE_BATCH" = "$AFTER_BATCH"
          test "$BEFORE_ROLE" = "$AFTER_ROLE"

      - name: Production prep must never synthesize GUI Actual PASS
        run: |
          grep -q 'CHECK_CURRENT_PALMIER_TIMELINE_EXPORT_RECEIPT' motion-studio/scripts/prepare-wedding-project-remotion-production-handoff.mts
          grep -q 'PALMIER_TIMELINE_RECEIPT_IS_RECHECKED_IMMEDIATELY_BEFORE_CANONICAL_PRODUCTION_EXPORT' motion-studio/scripts/prepare-wedding-project-remotion-production-handoff.mts
          ! grep -q "palmierGuiActual: 'PASS'" motion-studio/scripts/prepare-wedding-project-remotion-production-handoff.mts
          ! grep -q "macRemotionStudioGuiActual: 'PASS'" motion-studio/scripts/prepare-wedding-project-remotion-production-handoff.mts
          ! grep -q "macDavinciResolveGuiActual: 'PASS'" motion-studio/scripts/prepare-wedding-project-remotion-production-handoff.mts
          ! grep -q 'productionReadyPromotedByThisPrep: true' motion-studio/scripts/prepare-wedding-project-remotion-production-handoff.mts
