name: Resolve DRFX Neutral Fixture CI

on:
  pull_request:
    paths:
      - "motion-studio/fixtures/resolve/drfx/**"
      - "motion-studio/src/data/resolveDrfxFixture.schema.ts"
      - "motion-studio/src/data/resolveDrfxFixture.ts"
      - "motion-studio/src/data/resolveCanaryInputFixtures.ts"
      - "motion-studio/scripts/prepare-resolve-drfx-fixture.mts"
      - "motion-studio/scripts/prepare-resolve-canary-inputs.mts"
      - "scripts/davinci/deterministic-drfx-pack.py"
      - "docs/research/2026-08-26-movie-tool-learning-run-29-drfx-neutral-fixture.md"
      - "docs/runbooks/2026-08-26-resolve21-drfx-free-canary.md"
      - ".github/workflows/resolve-drfx-neutral-fixture-ci.yml"
  push:
    paths:
      - "motion-studio/fixtures/resolve/drfx/**"
      - "motion-studio/src/data/resolveDrfxFixture.schema.ts"
      - "motion-studio/src/data/resolveDrfxFixture.ts"
      - "motion-studio/src/data/resolveCanaryInputFixtures.ts"
      - "motion-studio/scripts/prepare-resolve-drfx-fixture.mts"
      - "motion-studio/scripts/prepare-resolve-canary-inputs.mts"
      - "scripts/davinci/deterministic-drfx-pack.py"
      - "docs/research/2026-08-26-movie-tool-learning-run-29-drfx-neutral-fixture.md"
      - "docs/runbooks/2026-08-26-resolve21-drfx-free-canary.md"
      - ".github/workflows/resolve-drfx-neutral-fixture-ci.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: motion-studio/pnpm-lock.yaml

      - name: Install motion-studio dependencies
        working-directory: motion-studio
        run: pnpm install --frozen-lockfile

      - name: Python packer syntax
        run: python3 -m py_compile scripts/davinci/deterministic-drfx-pack.py

      - name: TypeScript
        working-directory: motion-studio
        run: pnpm typecheck

      - name: DRFX planner dry-run
        working-directory: motion-studio
        run: |
          node --no-warnings scripts/prepare-resolve-canary-inputs.mts drfx --dry-run > /tmp/drfx-dry-run.txt
          grep -Fq 'DV21-DRFX-FREE-01 neutral DRFX fixture' /tmp/drfx-dry-run.txt
          grep -Fq 'humanAdjustabilityCandidate=EASY_INSPECTOR' /tmp/drfx-dry-run.txt
          grep -Fq 'runtimeState=PENDING_RUNTIME' /tmp/drfx-dry-run.txt

      - name: Generate deterministic DRFX fixture
        working-directory: motion-studio
        run: |
          node --no-warnings scripts/prepare-resolve-canary-inputs.mts drfx
          test -s out/canary-inputs/drfx/WeddingNeutralSolid.drfx
          test -s out/canary-inputs/drfx/WeddingNeutralSolid.manifest.json
          test -s out/canary-inputs/manifests/DV21-DRFX-FREE-01.json
          sha256sum out/canary-inputs/drfx/WeddingNeutralSolid.drfx | awk '{print $1}' > /tmp/drfx-hash-a
          grep -Fq '"runtimeState": "PENDING_RUNTIME"' out/canary-inputs/drfx/WeddingNeutralSolid.manifest.json
          grep -Fq '"expectedHumanAdjustability": "EASY_INSPECTOR"' out/canary-inputs/manifests/DV21-DRFX-FREE-01.json
          grep -Fq 'DRFX_ARCHIVE_VALID != RESOLVE_INSTALLABLE' out/canary-inputs/manifests/DV21-DRFX-FREE-01.json

      - name: Verify archive hierarchy and dependency-free source contract
        working-directory: motion-studio
        run: |
          python3 - <<'PY'
          import json, pathlib, zipfile
          path = pathlib.Path('out/canary-inputs/drfx/WeddingNeutralSolid.drfx')
          with zipfile.ZipFile(path) as z:
              infos = z.infolist()
              assert [i.filename for i in infos] == ['Edit/Generators/WeddingNeutralSolid/WeddingNeutralSolid.setting']
              assert infos[0].date_time == (1980, 1, 1, 0, 0, 0)
              assert '..' not in pathlib.PurePosixPath(infos[0].filename).parts
              setting = z.read(infos[0]).decode('utf-8')
          for token in ['WeddingNeutralSolid = GroupOperator', 'Name = "Color"', 'MainOutput1 = InstanceOutput', 'NeutralBackground = Background']:
              assert token in setting, token
          for token in ['Loader {', 'Fuse.', 'ofx.', 'Font =', 'SxSFilename', '/Users/', '/home/']:
              assert token not in setting, token
          manifest = json.loads(pathlib.Path('out/canary-inputs/drfx/WeddingNeutralSolid.manifest.json').read_text())
          deps = manifest['dependencies']
          assert all(deps[key] == [] for key in ['fonts', 'luts', 'ofx', 'plugins', 'externalAssets'])
          assert manifest['packagingVerification'] == {
              'zipReadable': True,
              'expectedHierarchyOnly': True,
              'noPathTraversal': True,
              'deterministicArchiveExpected': True,
          }
          assert len(manifest['exposedControls']) == 4
          assert {x['label'] for x in manifest['exposedControls']} == {'Color'}
          PY

      - name: Regeneration keeps the DRFX binary hash deterministic
        working-directory: motion-studio
        run: |
          node --no-warnings scripts/prepare-resolve-canary-inputs.mts drfx
          sha256sum out/canary-inputs/drfx/WeddingNeutralSolid.drfx | awk '{print $1}' > /tmp/drfx-hash-b
          diff -u /tmp/drfx-hash-a /tmp/drfx-hash-b

      - name: Hydrate DRFX evidence without claiming install success
        working-directory: motion-studio
        run: |
          evidence="out/canary-evidence/drfx-hydrated.json"
          node --no-warnings scripts/hydrate-resolve-canary-evidence.mts \
            out/canary-inputs/manifests/DV21-DRFX-FREE-01.json \
            --execution-id DV21-DRFX-FREE-01-CI-HYDRATED \
            --output "$evidence"
          node --no-warnings scripts/validate-resolve-canary-evidence.mts "$evidence"
          node -e "const e=require('./out/canary-evidence/drfx-hydrated.json'); const i=e.inputInventory.find(x=>x.id==='neutral-drfx'); if(e.result!=='NOT_RUN'||e.capturedAt!==null||e.promotionEligible!==false||i?.present!==true||e.stepResults.some(x=>x.status!=='NOT_RUN')) process.exit(1);"

      - name: Prepare DRFX runtime session without launching Resolve
        working-directory: motion-studio
        run: |
          execution="DV21-DRFX-FREE-01-CI-SESSION-A"
          session="out/canary-sessions/$execution"
          node --no-warnings scripts/prepare-resolve-canary-session.mts \
            DV21-DRFX-FREE-01 \
            --execution-id "$execution"
          test -s "$session/session.json"
          test -s "$session/evidence.json"
          node --no-warnings scripts/validate-resolve-canary-evidence.mts "$session/evidence.json"
          node -e "const s=require('./$session/session.json'); const e=require('./$session/evidence.json'); const i=e.inputInventory.find(x=>x.id==='neutral-drfx'); if(s.status!=='READY_FOR_RUNTIME'||s.runtimeLaunchPerformed!==false||e.result!=='NOT_RUN'||e.promotionEligible!==false||i?.present!==true) process.exit(1);"
          grep -Fq 'GENERATED_ARTIFACT != RUNTIME_VERIFIED_HANDOFF' "$session/RUN.md"
