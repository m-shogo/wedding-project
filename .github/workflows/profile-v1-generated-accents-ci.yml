name: Profile V1 Generated Accents CI

on:
  pull_request:
    paths:
      - "motion-studio/src/compositions/profile/ProfileV1.tsx"
      - "motion-studio/src/compositions/profile/ProfileV1GeneratedAccents.tsx"
      - "motion-studio/src/compositions/profile/ProfileV1GeneratedAccentsPreview.tsx"
      - "motion-studio/src/compositions/opening/DoorLight.tsx"
      - "motion-studio/src/ProfileV1Root.tsx"
      - "motion-studio/src/data/profileV1ProductionPlan.ts"
      - "motion-studio/src/data/profileV1GeneratedAccentRegistry.ts"
      - "motion-studio/scripts/check-profile-v1-generated-accents.mts"
      - "motion-studio/scripts/render-profile-v1-generated-accent-qa-stills.mts"
      - ".github/workflows/profile-v1-generated-accents-ci.yml"
  push:
    branches: [main]
    paths:
      - "motion-studio/src/compositions/profile/ProfileV1.tsx"
      - "motion-studio/src/compositions/profile/ProfileV1GeneratedAccents.tsx"
      - "motion-studio/src/compositions/profile/ProfileV1GeneratedAccentsPreview.tsx"
      - "motion-studio/src/compositions/opening/DoorLight.tsx"
      - "motion-studio/src/ProfileV1Root.tsx"
      - "motion-studio/src/data/profileV1ProductionPlan.ts"
      - "motion-studio/src/data/profileV1GeneratedAccentRegistry.ts"
      - "motion-studio/scripts/check-profile-v1-generated-accents.mts"
      - "motion-studio/scripts/render-profile-v1-generated-accent-qa-stills.mts"
      - ".github/workflows/profile-v1-generated-accents-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: motion-studio
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: motion-studio/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript
        run: pnpm typecheck

      - name: Generated-role coverage and reuse contracts
        run: node --no-warnings scripts/check-profile-v1-generated-accents.mts

      - name: Generated-role visual smoke stills
        run: node --no-warnings scripts/render-profile-v1-generated-accent-qa-stills.mts

      - name: Upload generated-role visual QA
        uses: actions/upload-artifact@v4
        with:
          name: profile-v1-generated-accents-visual-qa
          path: motion-studio/out/qa/profile-v1-generated-accents/*.png
          if-no-files-found: error
          retention-days: 7
