name: Wedding Final Delivery Evidence Manifest Dashboard CI

on:
  pull_request:
    paths:
      - 'movie-dashboard/scripts/sync-wedding-final-delivery-evidence-manifest-readiness.mjs'
      - 'movie-dashboard/scripts/verify-wedding-final-delivery-evidence-manifest-dashboard.mjs'
      - 'movie-dashboard/src/data/weddingFinalDeliveryEvidenceManifestReadiness.generated.ts'
      - 'movie-dashboard/src/data/weddingDavinciFinalDeliveryPreflight.ts'
      - 'movie-dashboard/src/components/WeddingDavinciDeliveryReadinessCard.tsx'
      - 'movie-dashboard/src/pages/VisualMotionLibrary.tsx'
      - 'motion-studio/scripts/wedding-final-delivery-evidence-manifest.mts'
      - 'motion-studio/scripts/wedding-final-delivery-evidence-manifest-currentness.mts'
      - '.github/workflows/wedding-final-delivery-evidence-manifest-dashboard-ci.yml'
  push:
    branches: [main]
    paths:
      - 'movie-dashboard/scripts/sync-wedding-final-delivery-evidence-manifest-readiness.mjs'
      - 'movie-dashboard/scripts/verify-wedding-final-delivery-evidence-manifest-dashboard.mjs'
      - 'movie-dashboard/src/data/weddingFinalDeliveryEvidenceManifestReadiness.generated.ts'
      - 'movie-dashboard/src/data/weddingDavinciFinalDeliveryPreflight.ts'
      - 'movie-dashboard/src/components/WeddingDavinciDeliveryReadinessCard.tsx'
      - 'movie-dashboard/src/pages/VisualMotionLibrary.tsx'
      - 'motion-studio/scripts/wedding-final-delivery-evidence-manifest.mts'
      - 'motion-studio/scripts/wedding-final-delivery-evidence-manifest-currentness.mts'
      - '.github/workflows/wedding-final-delivery-evidence-manifest-dashboard-ci.yml'

jobs:
  final-evidence-manifest-dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: movie-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: movie-dashboard/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Verify Final Evidence Manifest Dashboard gate
        run: node scripts/verify-wedding-final-delivery-evidence-manifest-dashboard.mjs
