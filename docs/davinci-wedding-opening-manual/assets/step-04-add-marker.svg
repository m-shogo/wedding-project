<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">DaVinci ResolveでMキーを押してマーカーを追加する簡略図</title>
  <desc id="desc">Editページのタイムライン上で再生ヘッドを0:16付近に置き、Mキーを押すと上部に色付きマーカーが追加されることを示す。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0" stop-color="#1d232b"/>
      <stop offset="1" stop-color="#242d36"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect width="1200" height="620" rx="28" fill="url(#bg)"/>
  <rect x="34" y="34" width="1132" height="72" rx="14" fill="#313b45"/>
  <text x="68" y="79" fill="#dbe4ec" font-family="Arial,sans-serif" font-size="25" font-weight="700">Edit</text>
  <text x="1070" y="79" fill="#93a1ad" font-family="Arial,sans-serif" font-size="20">00:00:16:00</text>

  <rect x="34" y="128" width="1132" height="424" rx="18" fill="#171c21" stroke="#3e4852"/>
  <rect x="58" y="157" width="1084" height="55" rx="10" fill="#272f37"/>
  <text x="78" y="190" fill="#8f9aa4" font-family="Arial,sans-serif" font-size="18">Timeline ruler</text>
  <line x1="83" y1="212" x2="1115" y2="212" stroke="#4c5964" stroke-width="2"/>

  <g fill="#697681" font-family="Arial,sans-serif" font-size="15">
    <text x="80" y="240">0:00</text><text x="326" y="240">0:08</text><text x="574" y="240">0:16</text><text x="820" y="240">0:24</text><text x="1060" y="240">0:32</text>
  </g>

  <rect x="58" y="270" width="1084" height="105" rx="11" fill="#223a4d"/>
  <text x="79" y="303" fill="#8db6cf" font-family="Arial,sans-serif" font-size="17" font-weight="700">A1</text>
  <path d="M118 331 C150 299 182 360 214 327 S278 357 310 326 S374 357 406 328 S470 359 502 325 S566 357 598 328 S662 358 694 326 S758 357 790 327 S854 358 886 326 S950 357 982 328 S1046 356 1082 327" fill="none" stroke="#7fc0e7" stroke-width="4" opacity=".9"/>
  <text x="82" y="357" fill="#c8d6df" font-family="Arial,sans-serif" font-size="18">StaRt</text>

  <line x1="594" y1="207" x2="594" y2="405" stroke="#ff7567" stroke-width="4"/>
  <path d="M583 207 L605 207 L594 225 Z" fill="#ff7567"/>
  <text x="623" y="266" fill="#ffb0a9" font-family="Arial,sans-serif" font-size="17" font-weight="700">再生ヘッドをここへ</text>

  <path d="M594 157 L613 172 L594 187 L575 172 Z" fill="#ffd65a" filter="url(#shadow)"/>
  <text x="623" y="181" fill="#ffe996" font-family="Arial,sans-serif" font-size="17" font-weight="700">Mを押す → マーカー</text>

  <g transform="translate(700 430)" filter="url(#shadow)">
    <rect width="300" height="93" rx="18" fill="#fff"/>
    <rect x="21" y="18" width="58" height="58" rx="13" fill="#123b63"/>
    <text x="50" y="58" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="30" font-weight="900">M</text>
    <text x="99" y="42" fill="#18212b" font-family="Arial,sans-serif" font-size="18" font-weight="800">1回押す</text>
    <text x="99" y="67" fill="#66717d" font-family="Arial,sans-serif" font-size="15">→ 目印が付く</text>
  </g>

  <g transform="translate(82 430)">
    <text x="0" y="18" fill="#ffd65a" font-family="Arial,sans-serif" font-size="16" font-weight="900">覚える場所は2つだけ</text>
    <text x="0" y="50" fill="#d4dde4" font-family="Arial,sans-serif" font-size="19">① 赤い線 = いまの位置</text>
    <text x="0" y="82" fill="#d4dde4" font-family="Arial,sans-serif" font-size="19">② 黄色い印 = Mで付けた目印</text>
  </g>
</svg>